<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fanta Asta — Rose</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #1a1a2e; color: #fff; padding: 15px; }
    h1 { text-align: center; margin-bottom: 15px; font-size: 1.4rem; }
    .board {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 15px;
    }
    .column {
      min-width: 210px;
      max-width: 210px;
      background: #16213e;
      border-radius: 10px;
      padding: 12px;
      flex-shrink: 0;
    }
    .col-header {
      text-align: center;
      border-bottom: 2px solid #4ecca3;
      padding-bottom: 8px;
      margin-bottom: 10px;
    }
    .col-header .team-name { font-weight: bold; font-size: 0.95rem; }
    .col-header .team-crediti { color: #4ecca3; font-size: 1.1rem; font-weight: bold; margin-top: 4px; }
    .role-group { margin-bottom: 10px; }
    .role-title {
      font-size: 0.75rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
      border-bottom: 1px solid #333;
      padding-bottom: 2px;
    }
    .player-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 3px 0;
      font-size: 0.85rem;
    }
    .player-row .p-name { flex: 1; }
    .player-row .p-recovery {
      color: #f5c542;
      font-size: 0.75rem;
      min-width: 30px;
      text-align: right;
    }
    .player-row .p-del {
      background: none;
      border: none;
      color: #e94560;
      cursor: pointer;
      font-size: 1rem;
      padding: 0 4px;
      line-height: 1;
    }
    .player-row .p-del:hover { color: #ff6b8a; }
    .add-form {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid #333;
    }
    .add-form input, .add-form select {
      width: 100%;
      padding: 5px 8px;
      margin-bottom: 5px;
      border-radius: 5px;
      border: 1px solid #333;
      background: #1a1a2e;
      color: #fff;
      font-size: 0.8rem;
    }
    .add-form button {
      width: 100%;
      padding: 6px;
      border: none;
      border-radius: 5px;
      background: #4ecca3;
      color: #1a1a2e;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .add-form button:hover { background: #3db892; }
    .empty-role { color: #555; font-size: 0.8rem; font-style: italic; padding: 2px 0; }
  </style>
</head>
<body>
  <h1>⚽ Rose — Asta di Riparazione</h1>
  <div class="board" id="board"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    var supabase = window.supabase.createClient(
      'https://tlgzvgdxhtiavobyyxze.supabase.co',
      'sb_publishable_a0DVw4Juvcxls3mJVFfGKQ_CMYTG9mL'
    );

    var roleOrder = ['POR', 'DIF', 'CENTRO', 'ATT'];
    var roleLabels = { POR: 'Portieri', DIF: 'Difensori', CENTRO: 'Centrocampisti', ATT: 'Attaccanti' };

    function calcRecovery(pagato, inSerieA) {
      if (!inSerieA) return pagato;
      return Math.ceil(pagato / 2);
    }

    async function loadAll() {
      // Carica squadre
      var resSquadre = await supabase.from('squadre').select('nome, crediti').order('id');
      var squadre = resSquadre.data || [];

      // Carica tutti i giocatori venduti
      var resPlayers = await supabase.from('players')
        .select('id, nome, ruolo, prezzo_finale, in_serie_a, vincitore')
        .eq('stato', 'sold').order('id');
      var players = resPlayers.data || [];

      var board = document.getElementById('board');
      board.innerHTML = '';

      squadre.forEach(function(sq) {
        var col = document.createElement('div');
        col.className = 'column';
        col.id = 'col-' + sq.nome.replace(/\s+/g, '-');

        // Header
        var header = document.createElement('div');
        header.className = 'col-header';
        header.innerHTML = '<div class="team-name">' + sq.nome + '</div>' +
          '<div class="team-crediti" id="cred-' + sq.nome.replace(/\s+/g, '-') + '">' + sq.credito + ' cr</div>';
        col.appendChild(header);

        // Giocatori per ruolo
        var myPlayers = players.filter(function(p) { return p.vincitore === sq.nome; });

        roleOrder.forEach(function(role) {
          var rolePlayers = myPlayers.filter(function(p) { return p.ruolo === role; })
            .sort(function(a, b) {
              return calcRecovery(b.prezzo_finale, b.in_serie_a) - calcRecovery(a.prezzo_finale, a.in_serie_a);
            });

          var group = document.createElement('div');
          group.className = 'role-group';
          group.innerHTML = '<div class="role-title">' + roleLabels[role] + '</div>';

          if (rolePlayers.length === 0) {
            group.innerHTML += '<div class="empty-role">—</div>';
          } else {
            rolePlayers.forEach(function(p) {
              var rec = calcRecovery(p.prezzo_finale, p.in_serie_a);
              var row = document.createElement('div');
              row.className = 'player-row';
              row.innerHTML =
                '<span class="p-name">' + p.nome + '</span>' +
                '<span class="p-recovery">+' + rec + '</span>' +
                '<button class="p-del" onclick="releasePlayer(' + p.id + ', \'' + sq.nome + '\', ' + p.prezzo_finale + ', ' + p.in_serie_a + ')">×</button>';
              group.appendChild(row);
            });
          }
          col.appendChild(group);
        });

        // Form aggiunta
        var form = document.createElement('div');
        form.className = 'add-form';
        form.innerHTML =
          '<input type="text" id="new-name-' + sq.nome.replace(/\s+/g, '-') + '" placeholder="Nome giocatore">' +
          '<select id="new-role-' + sq.nome.replace(/\s+/g, '-') + '">' +
            '<option value="POR">POR</option>' +
            '<option value="DIF">DIF</option>' +
            '<option value="CENTRO">CENTRO</option>' +
            '<option value="ATT">ATT</option>' +
          '</select>' +
          '<input type="number" id="new-cost-' + sq.nome.replace(/\s+/g, '-') + '" placeholder="Costo (cr)" min="0">' +
          '<button onclick="addPlayer(\'' + sq.nome + '\', ' + sq.credito + ')">+ Aggiungi</button>';
        col.appendChild(form);

        board.appendChild(col);
      });
    }

    async function releasePlayer(playerId, teamName, pagato, inSerieA) {
      if (!confirm('Svincolare questo giocatore?')) return;
      var recovery = calcRecovery(pagato, inSerieA);

      // Rimuove il giocatore
      await supabase.from('players').update({
        stato: 'pending',
        vincitore: null,
        prezzo_finale: null
      }).eq('id', playerId);

      // Aggiunge crediti alla squadra
      await supabase.from('squadre').update({ crediti: supabase.rpc('add_crediti', { p_nome: teamName, p_amount: recovery }) });

      // Fallback: se la function non esiste, facciamo read + update
      var res = await supabase.from('squadre').select('crediti').eq('nome', teamName);
      if (res.data && res.data.length > 0) {
        await supabase.from('squadre').update({ crediti: res.data[0].crediti + recovery }).eq('nome', teamName);
      }

      loadAll();
    }

    async function addPlayer(teamName, currentCrediti) {
      var safeName = teamName.replace(/\s+/g, '-');
      var name = document.getElementById('new-name-' + safeName).value.trim();
      var role = document.getElementById('new-role-' + safeName).value;
      var cost = parseInt(document.getElementById('new-cost-' + safeName).value);

      if (!name) { alert('Inserisci il nome del giocatore'); return; }
      if (isNaN(cost) || cost < 0) { alert('Inserisci il costo'); return; }
      if (cost > currentCrediti) { alert('Crediti insufficienti! Hai ' + currentCrediti + ' cr.'); return; }

      // Verifica che il giocatore non sia già in un'altra rosa
      var existing = await supabase.from('players').select('id, vincitore').eq('nome', name).eq('stato', 'sold');
      if (existing.data && existing.data.length > 0) {
        if (!confirm('Il giocatore è già in un\'altra rosa (' + existing.data[0].vincitore + '). Continuare?')) return;
        // Rimuove dalla vecchia rosa
        await supabase.from('players').update({ stato: 'pending', vincitore: null, prezzo_finale: null }).eq('id', existing.data[0].id);
      }

      // Cerca se esiste già nel listone (per recuperare ruolo/in_serie_a)
      var inListone = await supabase.from('players').select('id, ruolo, in_serie_a').eq('nome', name).eq('stato', 'pending');

      if (inListone.data && inListone.data.length > 0) {
        // Aggiorna il giocatore esistente
        await supabase.from('players').update({
          stato: 'sold',
          vincitore: teamName,
          prezzo_finale: cost,
          ruolo: role
        }).eq('id', inListone.data[0].id);
      } else {
        // Crea nuovo
        await supabase.from('players').insert({
          nome: name,
          ruolo: role,
          stato: 'sold',
          vincitore: teamName,
          prezzo_finale: cost,
          in_serie_a: true
        });
      }

      // Sottrae crediti
      var res = await supabase.from('squadre').select('crediti').eq('nome', teamName);
      if (res.data && res.data.length > 0) {
        await supabase.from('squadre').update({ crediti: res.data[0].crediti - cost }).eq('nome', teamName);
      }

      loadAll();
    }

    // Realtime: aggiorna quando qualcuno fa una modifica
    supabase.channel('board-channel')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'players' },
        function() { loadAll(); }
      ).subscribe();

    supabase.channel('squadre-channel')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'squadre' },
        function() { loadAll(); }
      ).subscribe();

    // Init
    loadAll();
  </script>
</body>
</html>
