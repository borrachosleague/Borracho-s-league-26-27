name: Optimize web graphics
# Runs automatically when source PNG graphics change.
on:
  push:
    paths:
      - '.github/workflows/optimize-assets.yml'
      - 'loghi finiti/*.png'
      - 'assets/borrachos/backgrounds/classifica/classifica-lavagna.png'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Convert heavy PNG assets to WebP
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          sources = list(Path('loghi finiti').glob('*.png'))
          sources += [Path('assets/borrachos/backgrounds/classifica/classifica-lavagna.png')]

          for src in sources:
              if not src.exists():
                  continue
              out = src.with_suffix('.webp')
              im = Image.open(src)
              # Team crests are rendered small: cap oversized originals while preserving transparency.
              if src.parent.name == 'loghi finiti':
                  im.thumbnail((512, 512), Image.Resampling.LANCZOS)
              im.save(out, 'WEBP', quality=88, method=6)
              print(src, '->', out, out.stat().st_size)
          PY
      - name: Commit optimized assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "loghi finiti" assets/borrachos/backgrounds/classifica/classifica-lavagna.webp
          git diff --cached --quiet || git commit -m "Generate optimized WebP graphics"
          git pull --rebase origin main
          git push
