<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BORRACHO'S LEAGUE 26-27</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f0f1a; color: #e0e0e0; min-height: 100vh; }

        .header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border-bottom: 3px solid #e94560;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        body.home-active .header { display: none; }

        .logo { display: flex; align-items: center; gap: 15px; }
        .logo img { width: 50px; height: 50px; border-radius: 50%; border: 2px solid #e94560; }
        .logo-text { font-size: 1.4em; font-weight: 800; color: #fff; text-transform: uppercase; letter-spacing: 1px; }
        .logo-text span { color: #e94560; }
        .logo-sub { font-size: 0.7em; color: #888; font-weight: 400; }

        .nav { display: flex; gap: 5px; }
        .nav-btn {
            background: transparent; border: 2px solid #333; color: #ccc;
            padding: 10px 20px; font-size: 0.9em; font-weight: 600;
            text-transform: uppercase; letter-spacing: 1px; cursor: pointer;
            border-radius: 6px; transition: all 0.3s;
        }
        .nav-btn:hover { border-color: #e94560; color: #fff; }
        .nav-btn.active { background: #e94560; border-color: #e94560; color: #fff; }

        .page { display: none; padding: 0 5px; max-width: 1200px; margin: 0 auto; position: relative; z-index: 10; }
        .page.active { display: block; }

        #page-home.active {
            position: fixed; top: 10px; left: 10px;
            width: 100vw; height: 100vh;
            padding: 0; margin: 0;
            background: url('logo.png') no-repeat center center;
            background-size: cover;
            z-index: 0;
        }

        .home-nav {
            position: absolute; right: 30px; top: 50%;
            transform: translateY(-50%);
            display: flex; flex-direction: column; gap: 15px; z-index: 10;
        }
        .home-nav .nav-btn {
            background: rgba(26,26,46,0.85); border: 2px solid #e94560; color: #fff;
            padding: 12px 25px; font-size: 1em; font-weight: 600;
            text-transform: uppercase; letter-spacing: 1px; cursor: pointer;
            border-radius: 6px; transition: all 0.3s; backdrop-filter: blur(5px);
        }
        .home-nav .nav-btn:hover { background: #e94560; }

        .page-title { font-size: 1.3em; font-weight: 800; color: #fff; margin-bottom: 2px; padding-bottom: 3px; border-bottom: 2px solid #e94560; display: inline-block; }

        .subnav { display: flex; gap: 5px; margin-bottom: 2px; flex-wrap: wrap; }
        .subnav-btn {
            background: #1a1a2e; border: 1px solid #333; color: #aaa;
            padding: 8px 18px; font-size: 0.85em; font-weight: 600;
            cursor: pointer; border-radius: 4px; transition: all 0.3s;
        }
        .subnav-btn:hover { border-color: #e94560; color: #fff; }
        .subnav-btn.active { background: #e94560; border-color: #e94560; color: #fff; }
        .subpage { display: none; }
        .subpage.active { display: block; }

        .table-container { overflow-x: auto; position: relative; z-index: 1; }
        table { width: 100%; border-collapse: collapse; background: #1a1a2e; border-radius: 8px; overflow: hidden; }
        thead { background: #16213e; }
        th { padding: 5px 6px; text-align: left; font-size: 0.9em; text-transform: uppercase; letter-spacing: 1px; color: #e94560; border-bottom: 2px solid #e94560; }
        td { padding: 4px 8px; border-bottom: 1px solid #222; font-size: 0.95em; }
        tr:hover { background: #1f1f35; }
        .pos { font-weight: 800; color: #e94560; width: 35px; }
        .logo-cell { width: 45px; }
        .logo-cell img { width: 48px; height: 48px; border-radius: 50%; }
        #tabella-giocatori .logo-cell img { width: 50px; height: 50px; }

        .criterio-select {
            background: #1a1a2e; border: 2px solid #333; color: #fff;
            padding: 8px 15px; font-size: 0.9em; border-radius: 6px;
            margin-bottom: 8px; cursor: pointer; display: block; width: 130px;
        }
        .criterio-select:focus { outline: none; border-color: #e94560; }

        .classifica-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

        .giocatori-layout {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }
        .giocatori-controls {
            flex: 0 0 140px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-top: 5px;
        }
        .ricerca-input {
            background: #1a1a2e;
            border: 2px solid #333;
            color: #fff;
            padding: 8px 10px;
            font-size: 0.85em;
            border-radius: 6px;
            width: 100%;
        }
        .ricerca-input:focus { outline: none; border-color: #e94560; }
        .giocatori-controls .criterio-select { width: 100%; margin-bottom: 0; }
        .giocatori-layout .table-container { flex: 1; margin-left: 0; }

        .titolo-riquadro {
            background: #16213e;
            border: 2px solid #e94560;
            border-radius: 6px;
            padding: 8px 15px;
            margin-bottom: 10px;
            font-size: 1.1em;
            font-weight: 700;
            color: #fff;
        }
        .desc-riquadro {
            background: #1a1a2e;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 8px 10px;
            margin-top: 10px;
            font-size: 0.8em;
            color: #aaa;
            min-height: 40px;
        }
        .sq-dati { flex: 1; }

        #tabella-risultati td { font-size: 1.1em; text-align: center; }
        #tabella-risultati th { font-size: 0.9em; text-align: center; }

        #sub-squadre .titolo-riquadro { display: none; }
        #sub-squadre .table-container { margin-left: 140px; margin-top: -110px; }
        #sub-squadre td:nth-child(3) { max-width: 120px; }
        #sub-squadre td:nth-child(4) { max-width: 60px; text-align: center; }
        #sub-squadre th:nth-child(3) { max-width: 120px; }
        #sub-squadre th:nth-child(4) { max-width: 60px; }
        #page-statistiche { padding-top: 0; }

        #sub-giocatori .criterio-select {
            width: auto;
            min-width: 120px;
            max-width: 180px;
            float: right;
        }
        #sub-squadre .criterio-select {
            width: auto;
            min-width: 120px;
            max-width: 180px;
            float: right;
        }

        .home-loghi {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            pointer-events: none;
        }
        .home-loghi img {
            position: absolute;
            width: 100px;
            height: 100px;
            opacity: 0.85;
        }

        #tabella-classifica td:nth-child(4) {
            font-size: 1.2em;
            font-weight: 800;
            color: #ffd700;
        }
        #tabella-classifica td:nth-child(11) {
            font-size: 1.2em;
            font-weight: 800;
            color: #e94560;
        }

        #sub-squadre .classifica-grid { margin-left: 140px; }
        #sub-giocatori td:last-child,
        #sub-squadre td:last-child { text-align: center; min-width: 35px; max-width: 55px; }

        .footer { text-align: center; padding: 20px; color: #444; font-size: 0.8em; margin-top: 40px; }
        .placeholder { text-align: center; padding: 60px 20px; color: #555; font-size: 1.2em; }

        /* === BEST 11 LAYOUT === */
        .best11-layout {
            display: flex;
            gap: 20px;
            align-items: flex-start;
            margin-top: 0;
        }
        .best11-controls {
            flex: 0 0 110px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-top: 5px;
        }
        .best11-label {
            font-size: 0.75em;
            font-weight: 700;
            color: #e94560;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 2px;
        }
        .subnav.best11-v {
            flex-direction: column;
            gap: 5px;
            margin-bottom: 10px;
        }
        .subnav.best11-v .subnav-btn {
            width: 100%;
            text-align: center;
            padding: 8px 10px;
            font-size: 0.8em;
        }

        /* === PITCH BEST 11 === */
        .pitch-container {
            position: relative;
            width: 100%;
            margin: 0;
            aspect-ratio: 16/10;
            background: linear-gradient(90deg, #2d5a27 0%, #3a7a33 50%, #2d5a27 100%);
            border: 3px solid #fff;
            border-radius: 8px;
            overflow: hidden;
            flex: 1;
        }
        .pitch-lines {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
        }
        .pitch-lines::before {
            content: '';
            position: absolute;
            top: 0; left: 50%;
            width: 2px; height: 100%;
            background: rgba(255,255,255,0.5);
        }
        .pitch-center-circle {
            position: absolute;
            top: 50%; left: 50%;
            height: 22%; aspect-ratio: 1;
            transform: translate(-50%, -50%);
            border: 2px solid rgba(255,255,255,0.5);
            border-radius: 50%;
        }
        .pitch-center-spot {
            position: absolute;
            top: 50%; left: 50%;
            width: 6px; height: 6px;
            transform: translate(-50%, -50%);
            background: rgba(255,255,255,0.7);
            border-radius: 50%;
        }
        .pitch-box-left, .pitch-box-right {
            position: absolute;
            top: 50%; transform: translateY(-50%);
            height: 55%; width: 10%;
            border: 2px solid rgba(255,255,255,0.5);
        }
        .pitch-box-left { left: 0; border-left: none; }
        .pitch-box-right { right: 0; border-right: none; }
        .pitch-goal-box-left, .pitch-goal-box-right {
            position: absolute;
            top: 50%; transform: translateY(-50%);
            height: 28%; width: 5%;
            border: 2px solid rgba(255,255,255,0.5);
        }
        .pitch-goal-box-left { left: 0; border-left: none; }
        .pitch-goal-box-right { right: 0; border-right: none; }
        .pitch-penalty-left, .pitch-penalty-right {
            position: absolute;
            top: 50%;
            width: 5px; height: 5px;
            background: rgba(255,255,255,0.7);
            border-radius: 50%;
        }
        .pitch-penalty-left { left: 7%; transform: translateY(-50%); }
        .pitch-penalty-right { right: 7%; transform: translateY(-50%); }

        .pitch-player {
            position: absolute;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            z-index: 2;
        }
        .pitch-player .pp-main {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .pitch-player .pp-logo {
            width: 58px; height: 58px;
            flex: 0 0 auto;
        }
        .pitch-player .pp-name {
            font-size: 1em;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 1px 3px rgba(0,0,0,0.9);
            background: rgba(0,0,0,0.72);
            padding: 2px 7px;
            border-radius: 4px;
            white-space: nowrap;
            max-width: 145px;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .pitch-player .pp-val {
            font-size: 0.9em;
            font-weight: 800;
            color: #ffd700;
            text-shadow: 0 1px 2px rgba(0,0,0,0.9);
        }
        .pitch-player .pp-ruolo {
            font-size: 0.65em;
            color: #ddd;
            text-shadow: 0 1px 2px rgba(0,0,0,0.9);
        }

        /* === RESPONSIVE === */
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 10px;
                padding: 10px 15px;
            }
            .nav { flex-wrap: wrap; justify-content: center; }
            .nav-btn { padding: 8px 12px; font-size: 0.8em; }
            .logo-text { font-size: 1.1em; }
            .logo img { width: 35px; height: 35px; }
            .home-nav { right: 10px; gap: 8px; }
            .home-nav .nav-btn { padding: 8px 15px; font-size: 0.85em; }
            .home-loghi img { width: 60px; height: 60px; }
            .table-container { font-size: 0.85em; }
            th, td { padding: 3px 5px; font-size: 0.85em; }
            .logo-cell img { width: 30px; height: 30px; }
            .giocatori-layout { flex-direction: column; }
            .giocatori-controls {
                flex: none;
                flex-direction: row;
                flex-wrap: wrap;
                gap: 5px;
            }
            .giocatori-controls .criterio-select { width: auto; }
            .ricerca-input { width: auto; flex: 1; }
            #sub-squadre .table-container { margin-left: 0; margin-top: 0; }
            #sub-giocatori .criterio-select,
            #sub-squadre .criterio-select { float: none; width: 100%; }
            .page-title { font-size: 1.1em; }
            .best11-layout { flex-direction: column; }
            .best11-controls {
                flex: none;
                flex-direction: row;
                flex-wrap: wrap;
                gap: 10px;
            }
            .subnav.best11-v { flex-direction: row; flex-wrap: wrap; }
            .subnav.best11-v .subnav-btn { width: auto; }
            .pitch-container { max-width: 100%; }
        }

        @media (max-width: 480px) {
            .home-loghi img { width: 45px !important; height: 45px !important; }
            .home-logo-right { right: 18% !important; }
            .home-nav { right: 50%; transform: translateX(50%); }
            .pitch-player .pp-main { gap: 3px; }
            .pitch-player .pp-logo { width: 39px; height: 39px; }
            .pitch-player .pp-name { font-size: 0.76em; max-width: 82px; padding: 1px 4px; }
            .pitch-player .pp-val { font-size: 0.72em; }
        }

    
        #tabella-giocatori tbody tr.riga-svincolato > td {
            background-color: #1688F8 !important;
            color: #FFFFFF !important;
        }
        #tabella-giocatori tbody tr.riga-svincolato:hover > td {
            background-color: #0F7FEA !important;
            color: #FFFFFF !important;
        }
</style>
</head>
<body>

<div class="header">
    <div class="logo">
        <img src="logo.png" alt="Logo" onerror="this.style.display='none'">
        <div>
            <div class="logo-text">BORRACHO'S <span>LEAGUE</span></div>
            <div class="logo-sub">STAGIONE 26-27</div>
        </div>
    </div>
    <div class="nav">
        <button class="nav-btn" onclick="showPage('home', this)">&#8962; Home</button>
        <button class="nav-btn" onclick="showPage('classifica', this)">Classifica</button>
        <button class="nav-btn" onclick="showPage('risultati', this)">Risultati</button>
        <button class="nav-btn" onclick="showPage('statistiche', this)">Statistiche</button>
        <button class="nav-btn" onclick="showPage('best11', this)">Best 11</button>
        <button class="nav-btn" onclick="location.href='asta.html'">🔨 Asta</button>
    </div>
</div>

<!-- HOME -->
<div id="page-home" class="page active">
    <div class="home-loghi" id="home-loghi"></div>
    <div class="home-nav">
        <button class="nav-btn" onclick="showPage('classifica', this)">Classifica</button>
        <button class="nav-btn" onclick="showPage('risultati', this)">Risultati</button>
        <button class="nav-btn" onclick="showPage('statistiche', this)">Statistiche</button>
        <button class="nav-btn" onclick="showPage('best11', this)">Best 11</button>
        <button class="nav-btn" onclick="location.href='asta.html'">🔨 Asta</button>
    </div>
</div>

<!-- CLASSIFICA -->
<div id="page-classifica" class="page">
    <select class="criterio-select" id="tipo-classifica" onchange="updateClassifica(); resizeSelect(this)">
        <option value="classifica">Classifica</option>
        <option value="f1">F1</option>
        <option value="br">Battle Royale</option>
    </select>
    <div class="table-container">
        <table id="tabella-classifica">
            <thead>
                <tr><th>Pos</th><th></th><th>Squadra</th><th>Pt</th><th>V</th><th>N</th><th>P</th><th>GF</th><th>GS</th><th>DR</th><th>Pt Totali</th></tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<!-- RISULTATI -->
<div id="page-risultati" class="page">
    <h2 class="page-title">Risultati</h2>
    <select class="criterio-select" id="sel-risultati" onchange="updateRisultati()"></select>
    <div class="table-container">
        <table id="tabella-risultati">
            <thead>
                <tr><th>Squadra Casa</th><th>Pt</th><th>Gol</th><th>Gol</th><th>Pt</th><th>Squadra Trasferta</th></tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<!-- STATISTICHE -->
<div id="page-statistiche" class="page">
    <h2 class="page-title">Statistiche</h2>
    <div class="subnav">
        <button class="subnav-btn active" onclick="showSubPage('giocatori', this)">Giocatori</button>
        <button class="subnav-btn" onclick="showSubPage('squadre', this)">Squadre</button>
    </div>

    <div id="sub-giocatori" class="subpage active">
        <div class="giocatori-layout">
            <div class="giocatori-controls">
                <input type="text" id="ricerca-giocatori" placeholder="Cerca giocatore..." oninput="updateGiocatori()" class="ricerca-input">
                <select class="criterio-select" id="gruppo-giocatori" onchange="cambiaGruppoGiocatori(); resizeSelect(this)">
                    <option value="borracho">Rosa Borracho</option>
                    <option value="seriea">Tutti Serie A</option>
                    <option value="svincolati">Svincolati</option>
                </select>
                <select class="criterio-select" id="tipo-giocatori" onchange="popolaCriteriGiocatori(); resizeSelect(this)">
                    <option value="titolari">Titolari</option>
                    <option value="totali">Totali</option>
                </select>
                <select class="criterio-select" id="criterio-giocatori" onchange="updateGiocatori(); resizeSelect(this)"></select>
            </div>
            <div class="table-container">
                <table id="tabella-giocatori">
                    <thead><tr><th>Pos</th><th></th><th>Giocatore</th><th>Squadra</th><th id="head-gioc"></th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="sub-squadre" class="subpage">
        <div class="giocatori-layout">
            <div class="giocatori-controls">
                <select class="criterio-select" id="categoria-squadre" onchange="popolaCriteriSquadre(); resizeSelect(this)">
                    <option value="reali">Reali</option>
                    <option value="bonus-malus">Bonus Malus</option>
                    <option value="best">Best</option>
                </select>
                <select class="criterio-select" id="criterio-squadre2" onchange="updateSquadre(); resizeSelect(this)"></select>
                <div id="desc-sq" class="desc-riquadro"></div>
            </div>
            <div class="sq-dati">
                <h3 style="margin:0 0 10px 0; text-align:center;">Statistiche Squadre</h3>
                <div id="titolo-sq" class="titolo-riquadro"></div>
                <div class="table-container">
                    <table id="tabella-sq">
                        <thead><tr><th>Pos</th><th></th><th>Squadra</th><th id="head-sq"></th></tr></thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- BEST 11 -->
<div id="page-best11" class="page">
    <h2 class="page-title">Best 11</h2>
    <div class="best11-layout">
        <div class="best11-controls">
            <div class="best11-label">Gruppo</div>
            <div class="subnav best11-v" id="best-gruppo">
                <button class="subnav-btn active" onclick="setBestGruppo('borracho', this)">Rosa Borracho</button>
                <button class="subnav-btn" onclick="setBestGruppo('seriea', this)">Tutti Serie A</button>
            </div>
            <div id="best-tipo-wrap">
                <div class="best11-label">Voti</div>
                <div class="subnav best11-v" id="best-tipo">
                    <button class="subnav-btn active" onclick="setBestTipo('titolari', this)">Titolari</button>
                    <button class="subnav-btn" onclick="setBestTipo('totali', this)">Totali</button>
                </div>
            </div>
            <div class="best11-label">Metrica</div>
            <div class="subnav best11-v" id="best-metrica">
                <button class="subnav-btn active" onclick="setBestMetric('mediavototit', this)">Media Voto</button>
                <button class="subnav-btn" onclick="setBestMetric('fvototit', this)">Media FVoto</button>
            </div>
            <div class="best11-label">Modulo</div>
            <div class="subnav best11-v" id="best-modulo">
                <button class="subnav-btn active" onclick="setBestModulo('352', this)">3-5-2</button>
                <button class="subnav-btn" onclick="setBestModulo('442', this)">4-4-2</button>
                <button class="subnav-btn" onclick="setBestModulo('433', this)">4-3-3</button>
                <button class="subnav-btn" onclick="setBestModulo('343', this)">3-4-3</button>
            </div>
        </div>
        <div class="pitch-container" id="pitch-best11">
            <div class="pitch-lines">
                <div class="pitch-center-circle"></div>
                <div class="pitch-center-spot"></div>
                <div class="pitch-box-left"></div>
                <div class="pitch-box-right"></div>
                <div class="pitch-goal-box-left"></div>
                <div class="pitch-goal-box-right"></div>
                <div class="pitch-penalty-left"></div>
                <div class="pitch-penalty-right"></div>
            </div>
        </div>
    </div>
</div>

<script>
let datiSquadre = [];
let datiGiocatori = [];
let datiGiocatoriSerieA = [];
let datiGiocatoriSvincolati = [];
let mappaBorrachoPerNome = Object.create(null);
let datiRisultati = [];
let datiStatSquadre = [];

var definizioni = {
    "pt": { titolo: "Punti", desc: "Punti solo dei voti" },
    "bonus": { titolo: "Punti Bonus", desc: "Punti Bonus/Malus" },
    "pt mod": { titolo: "Punti Mod", desc: "Punti del modificatore difesa" },
    "pt tot": { titolo: "Punti Totali", desc: "Punti fantavoto" },

function updateGiocatori() {
    var criterio = document.getElementById('criterio-giocatori').value;
    if (!criterio) return;
    var label = document.getElementById('criterio-giocatori').options[document.getElementById('criterio-giocatori').selectedIndex].text;
    document.getElementById('head-gioc').textContent = label;
    var headGioc = document.getElementById('head-gioc');
    var headRow = headGioc.parentElement;
    var oldPres = document.getElementById('head-presenze-gioc');
    if (oldPres) oldPres.remove();
    var mediaKeysHeader = ['mediavototit', 'fvototit', 'mediavototot', 'fvototot'];
    if (mediaKeysHeader.indexOf(criterio) !== -1) {
        var thPres = document.createElement('th');
        thPres.id = 'head-presenze-gioc';
        thPres.textContent = 'Presenze';
        headRow.appendChild(thPres);
    }
    var ricerca = document.getElementById('ricerca-giocatori').value.toLowerCase().trim();
    var elencoAttivo = elencoGiocatoriAttivo();

    // Media Voto e Fantamedia: ordinamento corretto per affidabilità (Bayes).
    // Il valore corretto NON viene mostrato: serve solo per la posizione in classifica.
    var criteriMedia = ['mediavototit', 'fvototit', 'mediavototot', 'fvototot'];
    var isMedia = criteriMedia.indexOf(criterio) !== -1;
    var presKeyMedia = criterio === 'mediavototit' ? 'prestit' :
                       criterio === 'fvototit' ? 'presfvtit' :
                       criterio === 'mediavototot' ? 'prestot' : 'presfvtot';
    var K_AFFIDABILITA = 5;

    var mediaGenerale = 0;
    if (isMedia) {
        var sommaPesata = 0, presenzeTotali = 0;
        elencoAttivo.forEach(function(g) {
            var p = Number(g[presKeyMedia] || 0);
            var m = Number(g[criterio] || 0);
            if (p > 0 && m > 0) {
                sommaPesata += m * p;
                presenzeTotali += p;
            }
        });
        mediaGenerale = presenzeTotali > 0 ? sommaPesata / presenzeTotali : 0;
    }

    function valoreOrdinamento(g) {
        var valore = Number(g[criterio] || 0);
        if (!isMedia) return valore;
        var p = Number(g[presKeyMedia] || 0);
        if (p <= 0) return 0;
        return (p / (p + K_AFFIDABILITA)) * valore +
               (K_AFFIDABILITA / (p + K_AFFIDABILITA)) * mediaGenerale;
    }

    var sorted = elencoAttivo.slice().sort(function(a, b) {
        var diff = valoreOrdinamento(b) - valoreOrdinamento(a);
        if (Math.abs(diff) > 0.0000001) return diff;
        return Number(b[presKeyMedia] || 0) - Number(a[presKeyMedia] || 0);
    });

    var isPortiere = criterio.indexOf('golsubiti') === 0 || criterio.indexOf('cleansheet') === 0 || criterio.indexOf('rigpar') === 0;
    var noPortiere = criterio.indexOf('gol') === 0 && criterio.indexOf('golsubiti') !== 0 ||
                     criterio.indexOf('assist') === 0 || criterio.indexOf('rig') === 0 && criterio.indexOf('rigpar') !== 0 ||
                     criterio.indexOf('autgol') === 0 || criterio === 'autgoltit' ||
                     criterio.indexOf('pres') === 0;

    // Non mostrare in classifica giocatori senza almeno una partita/voto valido.
    // Titolari -> presenze da titolare; Totali/Serie A/Svincolati -> presenze totali.
    var presKeyClassifica = criterio.endsWith('tot') ? 'prestot' : 'prestit';
    sorted = sorted.filter(function(g) {
        return Number(g[presKeyClassifica] || 0) > 0;
    });

    var filtered;
    if (ricerca) {
        filtered = sorted.filter(function(g) { return g.nome.toLowerCase().indexOf(ricerca) !== -1; });
    } else if (isPortiere) {
        if (criterio.indexOf('golsubiti') === 0) {
            var presKey = criterio.endsWith('tot') ? 'prestot' : 'prestit';
            filtered = sorted.filter(function(g) { return g.ruolo === 'p' && (g[presKey]||0) > 0; });
        } else {
            filtered = sorted.filter(function(g) { return g.ruolo === 'p' && (g[criterio]||0) > 0; });
        }
    } else if (noPortiere) {
        filtered = sorted.filter(function(g) { return g.ruolo !== 'p' && (g[criterio]||0) > 0; });
    } else {
        filtered = sorted.filter(function(g) { return (g[criterio]||0) > 0; });
    }

    var posizioni = [];
    for (var k = 0; k < sorted.length; k++) {
        if (k === 0) posizioni.push(1);
        else {
            var curr = valoreOrdinamento(sorted[k]);
            var prev = valoreOrdinamento(sorted[k-1]);
            if (Math.abs(curr - prev) < 0.0000001) posizioni.push(posizioni[k-1]);
            else posizioni.push(k + 1);
        }
    }

    var tbody = document.querySelector('#tabella-giocatori tbody');
    var righeHtml = [];
    filtered.forEach(function(g) {
        var pos = posizioni[sorted.indexOf(g)];
        var valoreMostrato = (g[criterio] || 0);
        var presenzeMostrate = isMedia ? Number(g[presKeyMedia] || 0) : '';
        var gruppoAttivo = document.getElementById('gruppo-giocatori').value;
        var logoCell = '<td class="logo-cell"></td>';

        if (gruppoAttivo === 'borracho') {
            logoCell = '<td class="logo-cell"><img src="' + logoUrl(g.squadra) + '" onerror="this.style.display=\'none\'"></td>';
        } else if (gruppoAttivo === 'seriea') {
            // Nei "Tutti Serie A" evidenzia chi appartiene a una rosa Borracho
            // mostrando il logo della relativa fantasquadra.
            var nomeNorm = String(g.nome || '').trim().toLowerCase()
                .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                .replace(/[^a-z0-9]/g, '');
            var squadraBorracho = mappaBorrachoPerNome[nomeNorm];
            var borracho = !!squadraBorracho;
            if (borracho) {
                logoCell = '<td class="logo-cell"><img src="' + logoUrl(squadraBorracho) + '" title="' + squadraBorracho + '" onerror="this.style.display=\'none\'"></td>';
            }
        }
        var classeRiga = '';
        if (gruppoAttivo === 'seriea' && !borracho) classeRiga = ' class="riga-svincolato"';
        if (gruppoAttivo === 'svincolati') classeRiga = ' class="riga-svincolato"';
        righeHtml.push('<tr' + classeRiga + '><td class="pos">' + pos + '</td>' + logoCell + '<td>' + g.nome + '</td><td>' + g.squadra + '</td><td>' + valoreMostrato + '</td>' + (isMedia ? '<td>' + presenzeMostrate + '</td>' : '') + '</tr>');
    });
    tbody.innerHTML = righeHtml.join('');
}

function normalizzaNomeSquadra(nome) {
    var n = String(nome || '')
        .trim()
        .toLowerCase()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .replace(/[^a-z0-9]/g, '');

    var alias = {
        'tricchetracht': 'tricchetrachtfrancoforte',
        'tricchetrachtfrankfurt': 'tricchetrachtfrancoforte',
        'tricchetrachtfrancoforte': 'tricchetrachtfrancoforte',

        'ilsestoasensio': 'sestoasensio',

        'pesciculinifc': 'pesciculini',
        'atlimprovvisato': 'atlimprovvisato',
        'atleticoimprovvisato': 'atlimprovvisato'
    };
    return alias[n] || n;
}

function nomeSquadraPerLogoStatistiche(nome) {
    var chiave = normalizzaNomeSquadra(nome);
    var trovata = datiSquadre.find(function(s) {
        return normalizzaNomeSquadra(s.nome) === chiave;

}

            return normalizzaNomeSquadra(s.nome) === chiave;

    return Number((sq.dati && sq.dati[criterio]) || 0);

function updateBest11() {
    var nums = bestModulo.split('').map(Number);
    var nDif = nums[0], nCen = nums[1], nAtt = nums[2];
    var container = document.getElementById('pitch-best11');
    container.querySelectorAll('.pitch-player').forEach(function(el) { el.remove(); });

    // Rosa Borracho: scelta fra voti da titolare e voti totali Serie A.
    // Tutti Serie A: solo voti totali Voto Statistico FC e comprende anche gli svincolati.
    var isSerieA = bestGruppo === 'seriea';
    var usaTotali = isSerieA || bestTipo === 'totali';
    var elencoBest = isSerieA ? datiGiocatoriSerieA : datiGiocatori;
    var bestMetric = bestMetricTipo === 'fanta'
        ? (usaTotali ? 'fvototot' : 'fvototit')
        : (usaTotali ? 'mediavototot' : 'mediavototit');
    var presKeyBest = bestMetricTipo === 'fanta'
        ? (usaTotali ? 'presfvtot' : 'presfvtit')
        : (usaTotali ? 'prestot' : 'prestit');

    var K_BEST11 = 5;
    var sommaPesataBest = 0, presenzeTotaliBest = 0;
    elencoBest.forEach(function(g) {
        var p = Number(g[presKeyBest] || 0);
        var m = Number(g[bestMetric] || 0);
        if (p > 0 && m > 0) {
            sommaPesataBest += m * p;
            presenzeTotaliBest += p;
        }
    });
    var mediaGeneraleBest = presenzeTotaliBest > 0 ? sommaPesataBest / presenzeTotaliBest : 0;

    function valoreBestBayes(g) {
        var p = Number(g[presKeyBest] || 0);
        var m = Number(g[bestMetric] || 0);
        if (p <= 0 || m <= 0) return -Infinity;
        return (p / (p + K_BEST11)) * m + (K_BEST11 / (p + K_BEST11)) * mediaGeneraleBest;
    }
    function ordinaBest(a, b) {
        var diff = valoreBestBayes(b) - valoreBestBayes(a);
        if (Math.abs(diff) > 0.0000001) return diff;
        return Number(b[presKeyBest] || 0) - Number(a[presKeyBest] || 0);
    }
    function perRuolo(ruolo) {
        return elencoBest.filter(function(g) {
            return String(g.ruolo || '').toLowerCase().slice(0,1) === ruolo
                && Number(g[presKeyBest] || 0) > 0
                && Number(g[bestMetric] || 0) > 0;
        }).sort(ordinaBest);
    }

    var players = [];
    var portieri = perRuolo('p');
    if (portieri.length > 0) players.push(portieri[0]);
    players = players.concat(perRuolo('d').slice(0, nDif));
    players = players.concat(perRuolo('c').slice(0, nCen));
    players = players.concat(perRuolo('a').slice(0, nAtt));

    var groups = [
        { list: players.slice(0, 1), x: 8 },
        { list: players.slice(1, 1 + nDif), x: 30 },
        { list: players.slice(1 + nDif, 1 + nDif + nCen), x: 55 },
        { list: players.slice(1 + nDif + nCen), x: 82 }
    ];

    groups.forEach(function(grp, gi) {
        var n = grp.list.length;
        var margin = (gi === 3 && n === 2) ? 35 : 15;
        grp.list.forEach(function(g, i) {
            var y = n === 1 ? 50 : margin + i * ((100 - 2 * margin) / (n - 1));
            var el = document.createElement('div');
            el.className = 'pitch-player';
            el.style.left = grp.x + '%';
            el.style.top = y + '%';
            var rl = g.ruolo === 'p' ? 'POR' : g.ruolo === 'd' ? 'DIF' : g.ruolo === 'c' ? 'CEN' : 'ATT';
            var logo = '';
            if (isSerieA) {
                var nomeNormBest = String(g.nome || '').trim().toLowerCase()
                    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                    .replace(/[^a-z0-9]/g, '');
                var squadraBorrachoBest = mappaBorrachoPerNome[nomeNormBest];
                if (squadraBorrachoBest) {
                    logo = '<img class="pp-logo" src="' + logoUrl(squadraBorrachoBest) + '" title="' + squadraBorrachoBest + '" onerror="this.style.display=\'none\'">';
                }
            } else {
                logo = '<img class="pp-logo" src="' + logoUrl(g.squadra) + '" onerror="this.style.display=\'none\'">';
            }
            el.innerHTML = '<div class="pp-main">'
                + '<span class="pp-name">' + g.nome + '</span>'
                + logo
                + '</div>'
                + '<span class="pp-val">' + (g[bestMetric] || 0) + '</span>'
                + '<span class="pp-ruolo">' + rl + (isSerieA ? ' · ' + g.squadra : '') + '</span>';
            container.appendChild(el);
        });
    });
}

// === CARICA DATI ===
fetch("dati.json")
    .then(function(r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function(d) {

        datiGiocatoriSvincolati = d.giocatori_svincolati || [];

        // Cache per riconoscere istantaneamente i giocatori già nelle rose Borracho.
        mappaBorrachoPerNome = Object.create(null);
        datiGiocatori.forEach(function(bg) {
            var bn = String(bg.nome || '').trim().toLowerCase()
                .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                .replace(/[^a-z0-9]/g, '');
            if (bn) mappaBorrachoPerNome[bn] = bg.squadra;
        });

        datiRisultati = d.risultati || [];
        datiStatSquadre = d.stat_squadre || [];
        var selSq = document.getElementById('criterio-squadre2');
        popolaCriteriSquadre();
        resizeSelect(document.getElementById('categoria-squadre'));

        var selR = document.getElementById('sel-risultati');
        selR.innerHTML = '';
        datiRisultati.forEach(function(g, i) {
            selR.innerHTML += '<option value="' + i + '">' + g.giornata + '\u00aa Giornata</option>';
        });

        updateClassifica();
        populateHomeLoghi();
        cambiaGruppoGiocatori();
        resizeSelect(document.getElementById('gruppo-giocatori'));
        resizeSelect(document.getElementById('criterio-giocatori'));
        updateSquadre();
        if (datiRisultati.length > 0) updateRisultati();
        updateBest11();
    })
    .catch(function(e) {
        document.body.innerHTML = '<div style="text-align:center;padding:40px;color:#e94560;">Errore: ' + e.message + '<br><br>Verifica che dati.json sia nella stessa cartella.</div>';
    });
