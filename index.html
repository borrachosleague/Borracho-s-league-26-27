<script>

/* ===== EDITOR PRIVATO BORRACHOS =====
   Ctrl+Alt+M -> inserisci password.
   La password NON è salvata in chiaro nel sorgente: solo hash SHA-256.
   L'abilitazione resta memorizzata esclusivamente nel browser usato. */
const BORRACHOS_EDITOR_HASH = "55170fd08ccfa95c76c30ad2a30cea9ac7c7b66a980af0a3419303e7ad4eeda7";
const BORRACHOS_EDITOR_KEY = "borrachos_editor_authorized_v1";

function borrachosEditorApplyAuth() {
    if (localStorage.getItem(BORRACHOS_EDITOR_KEY) === "1") {
        document.body.classList.add("editor-authorized");
        return true;
    }
    document.body.classList.remove("editor-authorized");
    return false;
}

async function borrachosSha256(text) {
    const data = new TextEncoder().encode(text);
    const hash = await crypto.subtle.digest("SHA-256", data);
    return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2,"0")).join("");
}

async function borrachosEditorLogin() {
    if (borrachosEditorApplyAuth()) {
        if (confirm("Modalità modifica già attiva. Vuoi disattivarla su questo browser?")) {
            localStorage.removeItem(BORRACHOS_EDITOR_KEY);
            document.body.classList.remove("editor-authorized","home-editing","layout-editing");
            homeEditorOn = false;
            layoutEditorOn = false;
        }
        return;
    }
    const pwd = prompt("Password modifica Borrachos:");
    if (pwd === null) return;
    const hash = await borrachosSha256(pwd);
    if (hash === BORRACHOS_EDITOR_HASH) {
        localStorage.setItem(BORRACHOS_EDITOR_KEY, "1");
        document.body.classList.add("editor-authorized");
        alert("Modalità modifica attivata su questo browser.");
    } else {
        alert("Password non corretta.");
    }
}

document.addEventListener("keydown", function(e) {
    if (e.ctrlKey && e.altKey && (e.key === "m" || e.key === "M")) {
        e.preventDefault();
        borrachosEditorLogin();

});

var layoutEditorOn=false, layoutSelected=null, layoutDrag=null;

function currentLayoutPage(){
    return Array.from(document.querySelectorAll('.page')).find(function(p){return p.classList.contains('active') && p.id!=='page-home';}) || null;
}
function pageLayoutTargets(){
    var p=currentLayoutPage(); if(!p)return [];
    var selectors={
        'page-classifica':['.classifica-board','.classifica-chalk-data','.classifica-special-data','.classifica-menu-board','.classifica-menu-btn'],
        'page-risultati':['.page-title','#risultati-giornate','.table-container'],
        'page-statistiche':['.page-title','.subnav','.subpage.active .giocatori-controls','.subpage.active .table-container','#titolo-sq','#desc-sq'],
        'page-best11':['.best11-choice-unit']
    };
    var arr=selectors[p.id]||[];
    var seen=[];
    arr.forEach(function(s){
        p.querySelectorAll(s).forEach(function(el){
            var cs=window.getComputedStyle(el);
            var r=el.getBoundingClientRect();
            var visible=cs.display!=='none' && cs.visibility!=='hidden' && r.width>0 && r.height>0;
            if(visible && seen.indexOf(el)<0)seen.push(el);
        });
    });
    return seen;
}
function refreshLayoutTargets(){
    document.querySelectorAll('.layout-editable').forEach(function(x){x.classList.remove('layout-editable','layout-selected');});
    if(!layoutEditorOn)return;
    pageLayoutTargets().forEach(function(el){el.classList.add('layout-editable');});
}
function toggleLayoutEditor(){
    layoutEditorOn=!layoutEditorOn; document.body.classList.toggle('layout-editing',layoutEditorOn);
    layoutSelected=null; refreshLayoutTargets();
}
function layoutPointerDown(e){
    if(!layoutEditorOn)return;
    var el=e.target.closest('.layout-editable'); if(!el)return;
    e.preventDefault(); e.stopPropagation();
    document.querySelectorAll('.layout-selected').forEach(function(x){x.classList.remove('layout-selected');});
    layoutSelected=el; el.classList.add('layout-selected');
    var r=el.getBoundingClientRect();
    layoutDrag={el:el,dx:e.clientX-r.left,dy:e.clientY-r.top};
    el.style.setProperty('position','fixed','important');
    el.style.setProperty('left',r.left+'px','important');
    el.style.setProperty('top',r.top+'px','important');
    el.style.setProperty('right','auto','important');
    el.style.setProperty('bottom','auto','important');
    el.style.setProperty('margin','0','important');
    el.style.zIndex = el.classList.contains('classifica-menu-board') ? '4' : '50000';
    el.style.setProperty('width',r.width+'px','important');
}
function layoutPointerMove(e){
    if(!layoutDrag)return;
    var el=layoutDrag.el,r=el.getBoundingClientRect();
    el.style.setProperty('left',Math.max(0,Math.min(innerWidth-r.width,e.clientX-layoutDrag.dx))+'px','important');
    el.style.setProperty('top',Math.max(0,Math.min(innerHeight-r.height,e.clientY-layoutDrag.dy))+'px','important');
}
function layoutPointerUp(){layoutDrag=null;}
function resizeLayoutSelected(delta){
    if(!layoutEditorOn||!layoutSelected)return;
    var r=layoutSelected.getBoundingClientRect();
    var nw=Math.max(100,Math.min(innerWidth,r.width*(1+delta)));
    layoutSelected.style.setProperty('width',nw+'px','important');
    layoutSelected.style.setProperty('aspect-ratio','auto','important');
    if(layoutSelected.tagName==='IMG')layoutSelected.style.setProperty('height','auto','important');
}
function resizeLayoutAxis(axis,delta){
    if(!layoutEditorOn||!layoutSelected)return;
    var r=layoutSelected.getBoundingClientRect();
    if(axis==='height'){
        var nh=Math.max(60,Math.min(innerHeight,r.height*(1+delta)));
        layoutSelected.style.setProperty('height',nh+'px','important');
        layoutSelected.style.setProperty('aspect-ratio','auto','important');
    }else{
        var nw=Math.max(100,Math.min(innerWidth,r.width*(1+delta)));
        layoutSelected.style.setProperty('width',nw+'px','important');
        layoutSelected.style.setProperty('aspect-ratio','auto','important');
    }
}
function confirmLayoutEditor(){

function layoutElementName(el,i){
    if(el.id)return '#'+el.id;
    if(el.classList.contains('classifica-menu-btn')){
        var buttons=Array.from(el.parentElement.querySelectorAll('.classifica-menu-btn'));
        return '.classifica-menu-btn:nth-child('+(buttons.indexOf(el)+1)+')';
    }
    if(el.classList.contains('pitch-player')){
        var cards=Array.from(document.querySelectorAll('#pitch-best11 .pitch-player'));
        var idx=cards.indexOf(el);
        var role=(el.querySelector('.pp-ruolo')||{}).textContent||'';
        role=role.trim().split(' ')[0].split('·')[0] || 'PLAYER';
        var sameRole=cards.slice(0,idx+1).filter(function(x){
            var rr=(x.querySelector('.pp-ruolo')||{}).textContent||'';
            return rr.trim().split(' ')[0].split('·')[0]===role;
        }).length;
        return '.best11-'+role.toLowerCase()+'-'+sameRole;
    }
    var cls=Array.from(el.classList).filter(function(x){return x!=='layout-editable'&&x!=='layout-selected';})[0];
    return cls?'.'+cls:'ELEMENTO_'+(i+1);
}
function copyPageLayout(){
    var p=currentLayoutPage(); if(!p)return;
    var data={page:p.id.replace('page-',''),viewport:Math.round(innerWidth)+'x'+Math.round(innerHeight),elements:{}};

    pageLayoutTargets().forEach(function(el,i){
        var r=el.getBoundingClientRect();
        data.elements[layoutElementName(el,i)]={x:Math.round(r.left),y:Math.round(r.top),width:Math.round(r.width),height:Math.round(r.height)};
    });
    var txt='PAGE LAYOUT\\n'+JSON.stringify(data,null,2);

}

function liveEsc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(x){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x];});}
function livePlayerName(p){
    if(p && p.nome) return p.nome;
    var pid=p&&p.pid;
    var all=(datiGiocatori||[]).concat(datiGiocatoriSerieA||[]);
    for(var i=0;i<all.length;i++) if(Number(all[i].id||all[i].pid)===Number(pid)) return all[i].nome||('Giocatore '+pid);
    return 'Giocatore '+pid;
}
function liveNumeroVoto(v){
    return (v!=null && v!=='' && Number(v)!==0 && Number.isFinite(Number(v))) ? Number(v).toFixed(1) : '—';
}
function liveVotoPagella(p){
    return liveNumeroVoto(p && p.m);
}
function liveFantaVoto(p){
    if(!p) return '—';
    // scr=56 e cscr=100 sono valori tecnici presenti anche a partite ferme:
    // non sono fantavoti e non vanno mostrati.
    var candidati=[p.cscr,p.scr];
    for(var i=0;i<candidati.length;i++){
        var v=Number(candidati[i]);
        if(Number.isFinite(v) && v>0 && v<20) return v.toFixed(1);
    }
    return '—';
}
function liveVotoDoppio(p){
    if(!p) return '';
    return '<div class="live-vote-stack"><span class="live-voto-pagella">'+liveVotoPagella(p)+'</span><span class="live-fantavoto">'+liveFantaVoto(p)+'</span></div>';
}
function renderLiveMatch(p){
    var h=p&&p.casa?p.casa:{}, a=p&&p.trasferta?p.trasferta:{};
    var ht=h.titolari||[], at=a.titolari||[], n=Math.max(ht.length,at.length,11);
    var hlogo='', alogo=''; try{hlogo=logoUrl(h.nome||'');}catch(e){} try{alogo=logoUrl(a.nome||'');}catch(e){}
    var rows='';
    for(var i=0;i<n;i++){
        var hp=ht[i], ap=at[i];
        rows+='<tr><td class="live-name-home">'+(hp?liveEsc(livePlayerName(hp)):'')+'</td><td class="live-vote">'+liveVotoDoppio(hp)+'</td><td class="live-vote">'+liveVotoDoppio(ap)+'</td><td class="live-name-away">'+(ap?liveEsc(livePlayerName(ap)):'')+'</td></tr>';
    }
    var htot=(h.totale!=null&&Number(h.totale)!==0)?Number(h.totale).toFixed(1):'—';
    var atot=(a.totale!=null&&Number(a.totale)!==0)?Number(a.totale).toFixed(1):'—';
    return '<div class="live-h2h-head"><div>'+(hlogo?'<img src="'+hlogo+'" alt="">':'')+'<b>'+liveEsc(h.nome||'Casa')+'</b><small>'+(h.consegnata?'Modulo '+liveEsc(h.modulo||'—'):'Formazione non consegnata')+'</small></div><strong>'+htot+' - '+atot+'</strong><div><b>'+liveEsc(a.nome||'Trasferta')+'</b>'+(alogo?'<img src="'+alogo+'" alt="">':'')+'<small>'+(a.consegnata?'Modulo '+liveEsc(a.modulo||'—'):'Formazione non consegnata')+'</small></div></div>'+
      '<div class="live-h2h-wrap"><table class="live-h2h"><colgroup><col class="live-col-name"><col class="live-col-vote"><col class="live-col-vote"><col class="live-col-name"></colgroup><thead><tr><th></th><th>Voto</th><th>Voto</th><th></th></tr></thead><tbody>'+rows+'</tbody><tfoot><tr class="live-totals-main"><td>TOTALE</td><td>'+htot+'</td><td>'+atot+'</td><td>TOTALE</td></tr><tr class="live-totals-sub"><td>PAGELLA</td><td class="live-summary-value">—</td><td class="live-summary-value">—</td><td>PAGELLA</td></tr><tr class="live-totals-sub"><td>FANTAVOTO</td><td class="live-summary-value">—</td><td class="live-summary-value">—</td><td>FANTAVOTO</td></tr><tr class="live-totals-sub"><td>MOD. DIFESA</td><td class="live-summary-value">—</td><td class="live-summary-value">—</td><td>MOD. DIFESA</td></tr></tfoot></table></div>';
}
var livePartiteCache=[], livePartitaAttiva=0;
function mostraLivePartita(indice){
    var grid=document.getElementById('live-grid'), home=document.getElementById('live-home'), detail=document.getElementById('live-detail'); if(!grid||!home||!detail||!livePartiteCache.length)return;
    indice=Math.max(0,Math.min(indice,livePartiteCache.length-1)); livePartitaAttiva=indice;
    var p=livePartiteCache[indice];
    grid.innerHTML='<div class="live-match">'+renderLiveMatch(p)+'</div>';
    var nav=document.getElementById('live-match-nav');
    if(nav) nav.innerHTML=livePartiteCache.map(function(x,i){
        var h=x.casa||{}, a=x.trasferta||{};
        var hl='', al=''; try{hl=logoUrl(h.nome||'');}catch(e){} try{al=logoUrl(a.nome||'');}catch(e){}
        return '<button type="button" class="live-match-jump'+(i===indice?' active':'')+'" onclick="mostraLivePartita('+i+')" title="'+liveEsc(h.nome||'Casa')+' - '+liveEsc(a.nome||'Trasferta')+'"><span class="live-nav-logos">'+(hl?'<img src="'+hl+'" alt="">':'')+(al?'<img src="'+al+'" alt="">':'')+'</span></button>';
    }).join('');
    home.style.display='none'; detail.style.display='block';
}
function tornaLiveTabellone(){
    var home=document.getElementById('live-home'), detail=document.getElementById('live-detail');
    if(home)home.style.display='block'; if(detail)detail.style.display='none';
}
function caricaLive(){
    var meta=document.getElementById('live-meta'), grid=document.getElementById('live-grid'); if(!meta||!grid)return;
    fetch('live.json?ts='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}).then(function(d){
        uniformaNomiSquadre(d);
        meta.innerHTML='Giornata Borrachos '+liveEsc(d.giornata_borrachos)+' · Serie A '+liveEsc(d.giornata_serie_a)+' · Formazioni '+liveEsc(d.formazioni_consegnate)+'/10 <span class="live-status">'+liveEsc(String(d.stato||'attesa').toUpperCase())+'</span>';
        livePartiteCache=d.partite||[];
        var sb=document.getElementById('live-scoreboard-body');
        if(sb) sb.innerHTML=livePartiteCache.map(function(p,i){
            var h=p.casa||{}, a=p.trasferta||{};
            var hp=(h.totale!=null&&Number(h.totale)!==0)?Number(h.totale).toFixed(1):'—';
            var ap=(a.totale!=null&&Number(a.totale)!==0)?Number(a.totale).toFixed(1):'—';
            var hg=(p.risultato_reale&&p.risultato_reale.gol_casa!=null)?p.risultato_reale.gol_casa:(p.risultato&&p.risultato.gol_casa!=null?p.risultato.gol_casa:'—');
            var ag=(p.risultato_reale&&p.risultato_reale.gol_trasferta!=null)?p.risultato_reale.gol_trasferta:(p.risultato&&p.risultato.gol_trasferta!=null?p.risultato.gol_trasferta:'—');
            return '<tr onclick="mostraLivePartita('+i+')"><td><div class="ris-team casa"><span>'+liveEsc(h.nome||'—')+'</span><img class="ris-logo" src="'+logoUrl(h.nome||'')+'" onerror="this.remove()"></div></td><td>'+hp+'</td><td class="live-goal">'+hg+'</td><td class="live-goal">'+ag+'</td><td>'+ap+'</td><td><div class="ris-team trasferta"><img class="ris-logo" src="'+logoUrl(a.nome||'')+'" onerror="this.remove()"><span>'+liveEsc(a.nome||'—')+'</span></div></td></tr>';
        }).join('');
        if(livePartitaAttiva>=livePartiteCache.length)livePartitaAttiva=0;
        if(!livePartiteCache.length) grid.innerHTML='<div class="live-error">Nessuna partita disponibile.</div>';
    }).catch(function(e){meta.textContent='LIVE BORRACHOS';grid.innerHTML='<div class="live-error">Errore caricamento LIVE: '+liveEsc(e && e.message ? e.message : e)+'</div>'; console.error('LIVE BORRACHOS',e);});
}

function showPage(page, btn) {
    document.querySelectorAll('.page').forEach(function(p) {
        p.classList.remove('active');
        p.style.display = 'none';
    });
    document.querySelectorAll('.nav-btn').forEach(function(b) { b.classList.remove('active'); });
    var target = document.getElementById('page-' + page);
    target.classList.add('active');
    target.style.display = 'block';
    if (btn) btn.classList.add('active');
    document.body.classList.toggle('home-active', page === 'home');
    if (page === 'live') { tornaLiveTabellone(); caricaLive(); }
    if (layoutEditorOn) { layoutEditorOn = false; document.body.classList.remove('layout-editing'); refreshLayoutTargets(); }
}

function warmSecondaryGraphics() {
    var classificaUrls = [
        'assets/borrachos/backgrounds/classifica/cantina%20spogliatotio.webp',
        'assets/borrachos/backgrounds/classifica/classifica-lavagna.webp',
        'assets/borrachos/backgrounds/classifica/classifica-menu-lavagna.webp',
        'assets/borrachos/backgrounds/classifica/classifica-3-colonne.webp',
        'assets/borrachos/navigation/classifica/classifica-tasto.webp',
        'assets/borrachos/navigation/classifica/formula1-tasto.webp',
        'assets/borrachos/navigation/classifica/battle-royale-tasto.webp'
    ];
    var run=function(){
        Promise.all(classificaUrls.map(function(src){
            return new Promise(function(resolve){
                var im=new Image();
                im.decoding='async';
                im.onload=function(){
                    if(im.decode) im.decode().catch(function(){}).then(resolve);
                    else resolve();
                };
                im.onerror=resolve;
                im.src=src;
                if(im.complete) im.onload();
            });
        })).then(function(){
            document.body.classList.add('classifica-graphics-ready');
        });
        var best=new Image();
        best.decoding='async';
        best.src='assets/borrachos/backgrounds/best11/santiago-bernabeer-best11.webp';
    };
    if ('requestIdleCallback' in window) requestIdleCallback(run,{timeout:1200});
    else setTimeout(run,500);
}

function populateHomeLoghi() {
    var container = document.getElementById('home-loghi');
    if (!container) return;
    container.innerHTML = '';
    var n = datiSquadre.length;
    var perColonna = 5;
    for (var i = 0; i < n; i++) {
        var img = document.createElement('img');
        img.decoding = 'async';
        img.src = logoUrl(datiSquadre[i].nome);
        img.onerror = function() { this.style.display = 'none'; };
        var col = Math.floor(i / perColonna);
        var row = i % perColonna;
        var y = 5 + row * 17;
        if (col === 0) {
            img.className = 'home-logo-left';
            img.style.left = '2%';
        } else {
            img.className = 'home-logo-right';
            img.style.right = '-25%';
            img.style.left = 'auto';
        }
        img.style.top = y + '%';
        container.appendChild(img);
    }
}

function nomeSquadraSito(nome) {
    var raw = String(nome == null ? '' : nome).trim();
    var key = raw.toLowerCase()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .replace(/[^a-z0-9]/g, '');
    var nomi = {
        'tricchetracht': 'Tricchetracht',
        'tricchetrachtfrankfurt': 'Tricchetracht',
        'tricchetrachtfrancoforte': 'Tricchetracht',
        'tricchettracht': 'Tricchetracht',
        'sestoasensio': 'Sesto Asensio',
        'ilsestoasensio': 'Sesto Asensio',
        'atlimprovvisato': 'Atl. Improvvisato',
        'atleticoimprovvisato': 'Atl. Improvvisato',
        'sangria': 'San Gria',
        'pesciculini': 'Pesciculini',
        'pesciculinifc': 'Pesciculini',
        'partizandegrado': 'Partizan Degrado',
        'acasparaghese': 'AC Asparaghese',
        'asparaghese': 'AC Asparaghese',
        'shark': 'Shark',
        'aspipperia': 'AS Pipperia',
        'pipperia': 'AS Pipperia',
        'fcinternazioanale': 'FC Internazioanale',
        'internazioanale': 'FC Internazioanale'
    };
    return nomi[key] || raw;
}
function uniformaNomiSquadre(obj) {
    if (Array.isArray(obj)) {
        obj.forEach(uniformaNomiSquadre);
    } else if (obj && typeof obj === 'object') {
        Object.keys(obj).forEach(function(k) {
            var v = obj[k];
            if (typeof v === 'string') {
                var corretto = nomeSquadraSito(v);
                if (corretto !== v) obj[k] = corretto;
            } else if (v && typeof v === 'object') {
                uniformaNomiSquadre(v);
            }
        });
    }
    return obj;
}

function updateClassifica() {
    var tipoEl = document.getElementById('tipo-classifica');
    var tipo = tipoEl ? tipoEl.value : 'classifica';
    var chalk = document.getElementById('classifica-chalk-data');
    var special = document.getElementById('classifica-special-data');
    if (!chalk || !special) return;
    chalk.innerHTML = '';
    special.innerHTML = '';

    if (tipo === 'classifica') {
        chalk.style.display = 'grid';
        special.style.display = 'none';
        var sorted = datiSquadre.slice().sort(function(a, b) {
            if (b.pt !== a.pt) return b.pt - a.pt;
            return b.pt_totali - a.pt_totali;
        });
        sorted.slice(0,10).forEach(function(sq, i) {
            var row = document.createElement('div');
            row.className = 'chalk-row';
            row.innerHTML =
                '<span class="chalk-pos">' + (i+1) + '</span>' +
                '<span class="chalk-logo"><img loading="eager" decoding="async" src="' + logoUrl(sq.nome) + '" onerror="this.style.display=\'none\'"></span>' +
                '<span class="chalk-team">' + sq.nome + '</span>' +
                '<span>' + (Number(sq.v||0)+Number(sq.n||0)+Number(sq.p||0)) + '</span>' +
                '<span>' + sq.v + '</span><span>' + sq.n + '</span><span>' + sq.p + '</span>' +
                '<span>' + sq.gf + '</span><span>' + sq.gs + '</span><span>' + sq.dr + '</span>' +
                '<span class="chalk-pt">' + sq.pt + '</span>';
            chalk.appendChild(row);
        });
        return;
    }

    chalk.style.display = 'none';
    special.style.display = 'grid';
    var sortedSpeciale = datiStatSquadre.slice().sort(function(a, b) {
        return Number((b.dati && b.dati[tipo]) || 0) - Number((a.dati && a.dati[tipo]) || 0);
    });
    sortedSpeciale.slice(0,10).forEach(function(sq, i) {
        var valore = Number((sq.dati && sq.dati[tipo]) || 0);
        var row = document.createElement('div');
        row.className = 'chalk-row chalk-row-speciale';
        row.innerHTML =
            '<span class="chalk-logo"><img loading="eager" decoding="async" src="' + logoUrl(sq.nome) + '" onerror="this.style.display=\'none\'"></span>' +
            '<span class="chalk-team">' + sq.nome + '</span>' +
            '<span class="chalk-pt">' + valore + '</span>';
        special.appendChild(row);
    });
}

function cambiaGruppoGiocatori() {
    var gruppo = document.getElementById('gruppo-giocatori').value;
    var tipo = document.getElementById('tipo-giocatori');
    var tipoWrapBtns = document.getElementById('stats-tipo-wrap');
    if (gruppo === 'borracho') {
        tipo.style.display = '';
        if (tipoWrapBtns) tipoWrapBtns.style.display = '';
        if (tipo.value !== 'titolari' && tipo.value !== 'totali') tipo.value = 'titolari';
    } else {
        tipo.value = 'totali';
        tipo.style.display = 'none';
        if (tipoWrapBtns) tipoWrapBtns.style.display = 'none';
    }
    popolaCriteriGiocatori();
}

    sel.innerHTML = '';
    criteriGiocatori[tipo].forEach(function(item) {

        opt.textContent = item[1];
        sel.appendChild(opt);

    updateGiocatori();
}

function updateGiocatori() {
    var criterio = document.getElementById('criterio-giocatori').value;
    if (!criterio) return;
    var label = document.getElementById('criterio-giocatori').options[document.getElementById('criterio-giocatori').selectedIndex].text;
    document.getElementById('head-gioc').textContent = label;
    var headGioc = document.getElementById('head-gioc');
    var headRow = headGioc.parentElement;
    var oldPres = document.getElementById('head-presenze-gioc');
    if (oldPres) oldPres.remove();
    var mediaKeysHeader = ['mediavototit', 'fvototit', 'mediavototot', 'fvototot'];
    if (mediaKeysHeader.indexOf(criterio) !== -1) {
        var thPres = document.createElement('th');
        thPres.id = 'head-presenze-gioc';
        thPres.textContent = 'Presenze';
        headRow.appendChild(thPres);
    }
    var ricerca = document.getElementById('ricerca-giocatori').value.toLowerCase().trim();
    var elencoAttivo = elencoGiocatoriAttivo();

    // Media Voto e Fantamedia: ordinamento corretto per affidabilità (Bayes).
    // Il valore corretto NON viene mostrato: serve solo per la posizione in classifica.
    var criteriMedia = ['mediavototit', 'fvototit', 'mediavototot', 'fvototot'];
    var isMedia = criteriMedia.indexOf(criterio) !== -1;
    var presKeyMedia = criterio === 'mediavototit' ? 'prestit' :
                       criterio === 'fvototit' ? 'presfvtit' :
                       criterio === 'mediavototot' ? 'prestot' : 'presfvtot';
    var K_AFFIDABILITA = 5;

    var mediaGenerale = 0;
    if (isMedia) {
        var sommaPesata = 0, presenzeTotali = 0;
        elencoAttivo.forEach(function(g) {
            var p = Number(g[presKeyMedia] || 0);
            var m = Number(g[criterio] || 0);
            if (p > 0 && m > 0) {
                sommaPesata += m * p;
                presenzeTotali += p;
            }
        });
        mediaGenerale = presenzeTotali > 0 ? sommaPesata / presenzeTotali : 0;
    }

    function valoreOrdinamento(g) {
        var valore = Number(g[criterio] || 0);
        if (!isMedia) return valore;
        var p = Number(g[presKeyMedia] || 0);
        if (p <= 0) return 0;
        return (p / (p + K_AFFIDABILITA)) * valore +
               (K_AFFIDABILITA / (p + K_AFFIDABILITA)) * mediaGenerale;
    }

    var sorted = elencoAttivo.slice().sort(function(a, b) {
        var diff = valoreOrdinamento(b) - valoreOrdinamento(a);
        if (Math.abs(diff) > 0.0000001) return diff;
        return Number(b[presKeyMedia] || 0) - Number(a[presKeyMedia] || 0);
    });

    var isPortiere = criterio.indexOf('golsubiti') === 0 || criterio.indexOf('cleansheet') === 0 || criterio.indexOf('rigpar') === 0;
    var noPortiere = criterio.indexOf('gol') === 0 && criterio.indexOf('golsubiti') !== 0 ||
                     criterio.indexOf('assist') === 0 || criterio.indexOf('rig') === 0 && criterio.indexOf('rigpar') !== 0 ||
                     criterio.indexOf('autgol') === 0 || criterio === 'autgoltit' ||
                     criterio.indexOf('pres') === 0;

    // Non mostrare in classifica giocatori senza almeno una partita/voto valido.
    // Titolari -> presenze da titolare; Totali/Serie A/Svincolati -> presenze totali.
    var presKeyClassifica = criterio.endsWith('tot') ? 'prestot' : 'prestit';
    sorted = sorted.filter(function(g) {
        return Number(g[presKeyClassifica] || 0) > 0;
    });

    var filtered;
    if (ricerca) {
        filtered = sorted.filter(function(g) { return g.nome.toLowerCase().indexOf(ricerca) !== -1; });
    } else if (isPortiere) {
        if (criterio.indexOf('golsubiti') === 0) {
            var presKey = criterio.endsWith('tot') ? 'prestot' : 'prestit';
            filtered = sorted.filter(function(g) { return g.ruolo === 'p' && (g[presKey]||0) > 0; });
        } else {
            filtered = sorted.filter(function(g) { return g.ruolo === 'p' && (g[criterio]||0) > 0; });
        }
    } else if (noPortiere) {
        filtered = sorted.filter(function(g) { return g.ruolo !== 'p' && (g[criterio]||0) > 0; });
    } else {
        filtered = sorted.filter(function(g) { return (g[criterio]||0) > 0; });
    }

    var posizioni = [];
    for (var k = 0; k < sorted.length; k++) {
        if (k === 0) posizioni.push(1);
        else {
            var curr = valoreOrdinamento(sorted[k]);
            var prev = valoreOrdinamento(sorted[k-1]);
            if (Math.abs(curr - prev) < 0.0000001) posizioni.push(posizioni[k-1]);
            else posizioni.push(k + 1);
        }
    }

    var tbody = document.querySelector('#tabella-giocatori tbody');
    var righeHtml = [];
    filtered.forEach(function(g) {
        var pos = posizioni[sorted.indexOf(g)];
        var valoreMostrato = (g[criterio] || 0);
        var presenzeMostrate = isMedia ? Number(g[presKeyMedia] || 0) : '';
        var gruppoAttivo = document.getElementById('gruppo-giocatori').value;
        var logoCell = '<td class="logo-cell"></td>';

        if (gruppoAttivo === 'borracho') {
            logoCell = '<td class="logo-cell"><img src="' + logoUrl(g.squadra) + '" onerror="this.style.display=\'none\'"></td>';
        } else if (gruppoAttivo === 'seriea') {
            // Nei "Tutti Serie A" evidenzia chi appartiene a una rosa Borracho
            // mostrando il logo della relativa fantasquadra.
            var nomeNorm = String(g.nome || '').trim().toLowerCase()
                .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                .replace(/[^a-z0-9]/g, '');
            var squadraBorracho = mappaBorrachoPerNome[nomeNorm];
            var borracho = !!squadraBorracho;
            if (borracho) {
                logoCell = '<td class="logo-cell"><img src="' + logoUrl(squadraBorracho) + '" title="' + squadraBorracho + '" onerror="this.style.display=\'none\'"></td>';
            }
        }
        var classeRiga = '';
        if (gruppoAttivo === 'seriea' && !borracho) classeRiga = ' class="riga-svincolato"';
        if (gruppoAttivo === 'svincolati') classeRiga = ' class="riga-svincolato"';
        righeHtml.push('<tr' + classeRiga + '><td class="pos">' + pos + '</td>' + logoCell + '<td>' + g.nome + '</td><td>' + g.squadra + '</td><td>' + valoreMostrato + '</td>' + (isMedia ? '<td>' + presenzeMostrate + '</td>' : '') + '</tr>');
    });
    tbody.innerHTML = righeHtml.join('');
}

function normalizzaNomeSquadra(nome) {
    var n = String(nome || '')
        .trim()
        .toLowerCase()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .replace(/[^a-z0-9]/g, '');

    var alias = {
        'tricchetracht': 'tricchetrachtfrancoforte',
        'tricchetrachtfrankfurt': 'tricchetrachtfrancoforte',
        'tricchetrachtfrancoforte': 'tricchetrachtfrancoforte',

    };

}

function nomeSquadraPerLogoStatistiche(nome) {
    var chiave = normalizzaNomeSquadra(nome);

        return normalizzaNomeSquadra(s.nome) === chiave;

            return normalizzaNomeSquadra(s.nome) === chiave;
        });
        return classifica ? Number(classifica.gs || 0) : 0;
    }
    return Number((sq.dati && sq.dati[criterio]) || 0);
}

function updateBest11() {
    var nums = bestModulo.split('').map(Number);
    var nDif = nums[0], nCen = nums[1], nAtt = nums[2];
    var container = document.getElementById('pitch-best11');
    container.querySelectorAll('.pitch-player').forEach(function(el) { el.remove(); });

    // Rosa Borracho: scelta fra voti da titolare e voti totali Serie A.
    // Tutti Serie A: solo voti totali Voto Statistico FC e comprende anche gli svincolati.
    var isSerieA = bestGruppo === 'seriea';
    var usaTotali = isSerieA || bestTipo === 'totali';
    var elencoBest = isSerieA ? datiGiocatoriSerieA : datiGiocatori;
    var bestMetric = bestMetricTipo === 'fanta'
        ? (usaTotali ? 'fvototot' : 'fvototit')
        : (usaTotali ? 'mediavototot' : 'mediavototit');
    var presKeyBest = bestMetricTipo === 'fanta'
        ? (usaTotali ? 'presfvtot' : 'presfvtit')
        : (usaTotali ? 'prestot' : 'prestit');

    var K_BEST11 = 5;
    var sommaPesataBest = 0, presenzeTotaliBest = 0;
    elencoBest.forEach(function(g) {
        var p = Number(g[presKeyBest] || 0);
        var m = Number(g[bestMetric] || 0);
        if (p > 0 && m > 0) {
            sommaPesataBest += m * p;
            presenzeTotaliBest += p;
        }
    });
    var mediaGeneraleBest = presenzeTotaliBest > 0 ? sommaPesataBest / presenzeTotaliBest : 0;

    function valoreBestBayes(g) {
        var p = Number(g[presKeyBest] || 0);
        var m = Number(g[bestMetric] || 0);
        if (p <= 0 || m <= 0) return -Infinity;
        return (p / (p + K_BEST11)) * m + (K_BEST11 / (p + K_BEST11)) * mediaGeneraleBest;
    }
    function ordinaBest(a, b) {
        var diff = valoreBestBayes(b) - valoreBestBayes(a);
        if (Math.abs(diff) > 0.0000001) return diff;
        return Number(b[presKeyBest] || 0) - Number(a[presKeyBest] || 0);
    }
    var giornateGiocate = giornateGiocateBest11();
    // Per i voti da TITOLARE la percentuale va calcolata sulle presenze
    // effettivamente disponibili nel campione titolari, non sulle giornate di lega:
    // altrimenti, nelle prime giornate, soglie alte possono svuotare completamente la Best 11.
    var basePresenzeBest = giornateGiocate;
    if (!usaTotali) {
        var maxPresenzeTitolari = 0;
        elencoBest.forEach(function(g) {
            var pTit = Number(g[presKeyBest] || 0);
            if (pTit > maxPresenzeTitolari) maxPresenzeTitolari = pTit;
        });
        if (maxPresenzeTitolari > 0) basePresenzeBest = maxPresenzeTitolari;
    }
    var presenzeMinime = bestPresenzePct <= 0 ? 1 : Math.ceil(basePresenzeBest * bestPresenzePct / 100);
    var infoPres = document.getElementById('best-presenze-info');
    if (infoPres) infoPres.textContent = basePresenzeBest + ' presenze disponibili · min ' + presenzeMinime + ' presenze';

    function perRuolo(ruolo) {
        return elencoBest.filter(function(g) {
            return String(g.ruolo || '').toLowerCase().slice(0,1) === ruolo
                && Number(g[presKeyBest] || 0) >= presenzeMinime
                && Number(g[bestMetric] || 0) > 0;
        }).sort(ordinaBest);
    }

    var players = [];
    var portieri = perRuolo('p');
    if (portieri.length > 0) players.push(portieri[0]);
    players = players.concat(perRuolo('d').slice(0, nDif));
    players = players.concat(perRuolo('c').slice(0, nCen));
    players = players.concat(perRuolo('a').slice(0, nAtt));

    var titolariSet = new Set(players);
    var bench = []
        .concat(perRuolo('p').filter(function(g) { return !titolariSet.has(g); }).slice(0, 1))
        .concat(perRuolo('d').filter(function(g) { return !titolariSet.has(g); }).slice(0, 3))
        .concat(perRuolo('c').filter(function(g) { return !titolariSet.has(g); }).slice(0, 3))
        .concat(perRuolo('a').filter(function(g) { return !titolariSet.has(g); }).slice(0, 3));

    var hoverCardBest11 = document.getElementById('best11-hover-card');
    function squadraBorrachoBest11(g) {
        if (!isSerieA) return g.squadra || '';
        var nomeNorm = String(g.nome || '').trim().toLowerCase()
            .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
            .replace(/[^a-z0-9]/g, '');
        return mappaBorrachoPerNome[nomeNorm] || '';
    }
    var best11Contenitori = ['fiaschetto.webp','boccale.webp','bottiglia-vino.webp','otre.webp','botte.webp','secchiello.webp','brocca.webp'];
    function contenitoreBest11(g, svincolato) {
        if (svincolato) return 'templates/aperol.webp';
        var key = String((g && g.nome) || '') + '|' + String((g && g.squadra) || '');
        var hash = 0;
        for (var i = 0; i < key.length; i++) hash = ((hash << 5) - hash + key.charCodeAt(i)) | 0;
        return 'templates/' + best11Contenitori[Math.abs(hash) % best11Contenitori.length];
    }

    function mostraSchedaBest11(g, ruoloLabel, squadraLogo) {
        if (!hoverCardBest11 || layoutEditorOn) return;
        var teamName = squadraLogo || (isSerieA ? 'SVINCOLATO' : (g.squadra || ''));
        var mediaVoto = usaTotali ? Number(g.mediavototot || 0) : Number(g.mediavototit || 0);
        var fantaMedia = usaTotali ? Number(g.fvototot || 0) : Number(g.fvototit || 0);
        var presenze = Number(g[presKeyBest] || 0);
        var qi = (g.qi !== undefined && g.qi !== null && g.qi !== '') ? Number(g.qi) : null;
        var qa = (g.qa !== undefined && g.qa !== null && g.qa !== '') ? Number(g.qa) : null;
        var diffQ = (qi !== null && qa !== null) ? qa - qi : null;
        var diffClass = diffQ > 0 ? 'up' : diffQ < 0 ? 'down' : 'flat';
        var diffText = diffQ === null ? '—' : (diffQ > 0 ? '+' : '') + diffQ;
        var logo3dFile = best11Logo3dUrl(squadraLogo);
        var svincolato = !squadraLogo;
        var logoSrc = logo3dFile || (squadraLogo ? logoUrl(squadraLogo) : '3d/svincolati-serie-aperol.webp');
        var contenitoreSrc = contenitoreBest11(g, svincolato);
        hoverCardBest11.className = 'best11-drink-hover is-visible';
        hoverCardBest11.innerHTML =
            '<div class="best11-drink-visual">' +
                '<img class="best11-drink-image" src="' + contenitoreSrc + '" alt="" onerror="this.style.visibility=\'hidden\'">' +
                '<img class="best11-drink-logo" src="' + logoSrc + '" alt="" onerror="this.style.visibility=\'hidden\'">' +
            '</div>' +
            '<div class="best11-drink-name">' + g.nome + '</div>' +
            '<div class="best11-drink-meta">' + teamName + ' · ' + ruoloLabel + '</div>' +
            '<div class="best11-drink-data">' +
                '<div><span>MV</span><b>' + mediaVoto.toFixed(2) + '</b></div>' +
                '<div><span>MFV</span><b>' + fantaMedia.toFixed(2) + '</b></div>' +
                '<div><span>QI</span><b>' + (qi === null ? '—' : qi) + '</b></div>' +
                '<div><span>QA</span><b>' + (qa === null ? '—' : qa) + '</b></div>' +
                '<div class="diff-' + diffClass + '"><span>+/-</span><b>' + diffText + '</b></div>' +
            '</div>';
        hoverCardBest11.setAttribute('aria-hidden','false');
    }
    function nascondiSchedaBest11() {
        if (!hoverCardBest11) return;
        hoverCardBest11.classList.remove('is-visible');
        hoverCardBest11.setAttribute('aria-hidden','true');
    }

    var benchList = document.getElementById('best11-bench-list');
    if (benchList) {
        benchList.innerHTML = '';
        bench.forEach(function(g) {
            var rlBench = g.ruolo === 'p' ? 'POR' : g.ruolo === 'd' ? 'DIF' : g.ruolo === 'c' ? 'CEN' : 'ATT';
            var squadraLogoBench = g.squadra;
            if (isSerieA) {
                var nomeNormBench = String(g.nome || '').trim().toLowerCase()
                    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                    .replace(/[^a-z0-9]/g, '');
                squadraLogoBench = mappaBorrachoPerNome[nomeNormBench] || '';
            }
            var logoBench3d = best11Logo3dUrl(squadraLogoBench);
            var logoBench = squadraLogoBench
                ? '<img class="bench-logo" src="' + (logoBench3d || logoUrl(squadraLogoBench)) + '" onerror="this.remove()">'
                : '<img class="bench-logo" src="3d/svincolati-serie-aperol.webp" onerror="this.remove()">';
            var benchEl = document.createElement('div');
            benchEl.className = 'bench-player';
            benchEl.innerHTML = logoBench
                + '<span class="bench-name" title="' + g.nome + '">' + g.nome + '</span>'
                + '<span class="bench-role">' + rlBench + '</span>'
                + '<span class="bench-vote">' + (g[bestMetric] || 0) + '</span>';
            benchEl.addEventListener('mouseenter', function() { mostraSchedaBest11(g, rlBench, squadraLogoBench); });
            benchEl.addEventListener('mouseleave', nascondiSchedaBest11);
            benchList.appendChild(benchEl);
        });
    }

    // Layout Best 11 approvati manualmente a 1536x735.
    // Solo le 11 card cambiano col modulo; campo, panchina e comandi restano indipendenti.
    var best11Layouts = {
        '352': [
            [758,128],[542,192],[754,220],[967,179],
            [406,403],[536,326],[762,307],[963,322],[1094,412],
            [635,477],[845,540]
        ],
        '442': [
            [758,144],[472,213],[664,225],[851,226],[1044,213],
            [431,403],[643,333],[847,333],[1068,395],
            [631,472],[839,472]
        ],
        '433': [
            [761,140],[461,240],[649,215],[834,216],[1028,245],
            [503,351],[746,322],[949,359],
            [402,467],[744,501],[1089,466]
        ],
        '343': [
            [754,141],[540,221],[754,222],[965,223],
            [412,328],[627,325],[847,329],[1059,331],
            [494,452],[746,496],[1001,441]
        ]
    };
    var approvedLayout = best11Layouts[bestModulo] || best11Layouts['352'];
    var viewportW = 1536, viewportH = 735;

    players.forEach(function(g, playerIndex) {
        var pos = approvedLayout[playerIndex] || [viewportW/2, viewportH/2];
        var el = document.createElement('div');
        el.className = 'pitch-player';
        // Coordinate esatte approvate nei PAGE LAYOUT a 1536x735.
        // Non reinterpretarle: devono coincidere con le posizioni impostate manualmente.
        el.style.setProperty('position','fixed','important');
        el.style.setProperty('left',pos[0] + 'px','important');
        el.style.setProperty('top',pos[1] + 'px','important');
        el.style.setProperty('margin','0','important');

        var rl = g.ruolo === 'p' ? 'POR' : g.ruolo === 'd' ? 'DIF' : g.ruolo === 'c' ? 'CEN' : 'ATT';
        var logo = '';
        if (isSerieA) {
            var nomeNormBest = String(g.nome || '').trim().toLowerCase()
                .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                .replace(/[^a-z0-9]/g, '');
            var squadraBorrachoBest = mappaBorrachoPerNome[nomeNormBest];
            if (squadraBorrachoBest) {
                var logo3dBest = best11Logo3dUrl(squadraBorrachoBest);
                logo = '<img class="pp-logo" loading="lazy" decoding="async" src="' + (logo3dBest || logoUrl(squadraBorrachoBest)) + '" title="' + squadraBorrachoBest + '" onerror="this.style.display=\'none\'">';
            } else {
                el.classList.add('pp-svincolato');
                logo = '<img class="pp-logo" loading="lazy" decoding="async" src="3d/svincolati-serie-aperol.webp" title="SVINCOLATO" onerror="this.style.display=\'none\'">';
            }
        } else {
            var logo3dBest = best11Logo3dUrl(g.squadra);
            logo = '<img class="pp-logo" loading="lazy" decoding="async" src="' + (logo3dBest || logoUrl(g.squadra)) + '" onerror="this.style.display=\'none\'">';
        }
        el.classList.add('pp-role-' + rl.toLowerCase());
        var nomeLen = String(g.nome || '').trim().length;
        if (nomeLen >= 18) el.classList.add('pp-name-xxl');
        else if (nomeLen >= 15) el.classList.add('pp-name-xl');
        else if (nomeLen >= 12) el.classList.add('pp-name-long');
        el.innerHTML = '<div class="pp-main">'
            + logo
            + '<span class="pp-copy"><span class="pp-name pp-name-' + (String(g.nome || '').length > 18 ? 'xl' : String(g.nome || '').length > 14 ? 'long' : String(g.nome || '').length > 10 ? 'medium' : 'normal') + '">' + g.nome + '</span>'
            + '<span class="pp-ruolo">' + rl + (isSerieA ? ' · ' + g.squadra : '') + '</span></span>'
            + '<span class="pp-val">' + (g[bestMetric] || 0) + '</span>'
            + '</div>';

        var squadraHover = isSerieA ? (squadraBorrachoBest || '') : g.squadra;
        el.addEventListener('mouseenter', function() { mostraSchedaBest11(g, rl, squadraHover); });
        el.addEventListener('mouseleave', nascondiSchedaBest11);

        container.appendChild(el);
    });
    if (layoutEditorOn) refreshLayoutTargets();

}

// === CARICA DATI ===
// Prima prova dati.json accanto all'index (sito GitHub / server locale).
// Se la pagina viene aperta direttamente come file:// e il browser blocca il fetch,
// usa automaticamente la copia pubblicata nel repository GitHub.
function caricaDatiBorrachos() {
    var locale = "dati.json?ts=" + Date.now();
    var github = "https://raw.githubusercontent.com/borrachosleague/Borracho-s-league-26-27/main/dati.json?ts=" + Date.now();

    return fetch(locale, { cache: "no-store" })
        .then(function(r) {
            if (!r.ok) throw new Error("HTTP " + r.status);
            return r.json();
        })
        .catch(function(errLocale) {
            console.warn("dati.json locale non raggiungibile; provo GitHub:", errLocale);
            return fetch(github, { cache: "no-store" }).then(function(r) {
                if (!r.ok) throw new Error("GitHub HTTP " + r.status);
                return r.json();
            });
        });
}

caricaDatiBorrachos()
    .then(function(d) {
        uniformaNomiSquadre(d);
        datiSquadre = d.squadre;
        datiGiocatori = d.giocatori || [];
        datiGiocatoriSerieA = d.giocatori_seriea || [];
        datiGiocatoriSvincolati = d.giocatori_svincolati || [];

        // Cache per riconoscere istantaneamente i giocatori già nelle rose Borracho.
        mappaBorrachoPerNome = Object.create(null);
        datiGiocatori.forEach(function(bg) {
            var bn = String(bg.nome || '').trim().toLowerCase()
                .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                .replace(/[^a-z0-9]/g, '');
            if (bn) mappaBorrachoPerNome[bn] = bg.squadra;
        });

        datiRisultati = d.risultati || [];
        datiStatSquadre = d.stat_squadre || [];
        var selSq = document.getElementById('criterio-squadre2');
        popolaCriteriSquadre();
        resizeSelect(document.getElementById('categoria-squadre'));

        var selR = document.getElementById('sel-risultati');
        var giornateWrap = document.getElementById('risultati-giornate');
        if (selR) selR.value = '0';
        if (giornateWrap) {
            giornateWrap.innerHTML = '';
            for (var gi = 0; gi < 36; gi++) {
                var giornataDati = datiRisultati[gi];
                var giocata = !!(giornataDati && giornataDati.partite && giornataDati.partite.some(function(p) {
                    return Number(p.pt_casa || 0) !== 0 || Number(p.pt_trasferta || 0) !== 0 ||
                           Number(p.gol_casa || 0) !== 0 || Number(p.gol_trasferta || 0) !== 0;
                }));
                var classiGiornata = 'giornata-btn' + (gi === 0 ? ' active' : '') + (giocata ? '' : ' future');
                giornateWrap.innerHTML += '<button class="' + classiGiornata + '" onclick="setGiornataRisultati(' + gi + ', this)">' + (gi + 1) + '</button>';
            }
        }

        // Prima renderizziamo la Classifica; il resto viene distribuito
        // nei frame successivi per non bloccare il primo caricamento della pagina.
        updateClassifica();
        warmSecondaryGraphics();
        requestAnimationFrame(function() {
            cambiaGruppoGiocatori();
            resizeSelect(document.getElementById('gruppo-giocatori'));
            resizeSelect(document.getElementById('criterio-giocatori'));
            requestAnimationFrame(function() {
                updateSquadre();
                if (datiRisultati.length > 0) updateRisultati();
                requestAnimationFrame(updateBest11);
            });
        });
    })
    .catch(function(e) {
        document.body.innerHTML = '<div style="text-align:center;padding:40px;color:#e94560;">Errore caricamento dati: ' + e.message + '<br><br>Non è stato possibile leggere né dati.json locale né la copia pubblicata su GitHub.</div>';
    });
</script>
