   La password NON è salvata in chiaro nel sorgente: solo hash SHA-256.
   L'abilitazione resta memorizzata esclusivamente nel browser usato. */
const BORRACHOS_EDITOR_HASH = "55170fd08ccfa95c76c30ad2a30cea9ac7c7b66a980af0a3419303e7ad4eeda7";
const BORRACHOS_EDITOR_KEY = "borrachos_editor_authorized_v1";

function borrachosEditorApplyAuth() {
    if (localStorage.getItem(BORRACHOS_EDITOR_KEY) === "1") {
        document.body.classList.add("editor-authorized");
        return true;
    }
    document.body.classList.remove("editor-authorized");
    return false;
}

async function borrachosSha256(text) {
    const data = new TextEncoder().encode(text);
    const hash = await crypto.subtle.digest("SHA-256", data);
    return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2,"0")).join("");
}

async function borrachosEditorLogin() {
    if (borrachosEditorApplyAuth()) {
        if (confirm("Modalità modifica già attiva. Vuoi disattivarla su questo browser?")) {
            localStorage.removeItem(BORRACHOS_EDITOR_KEY);
            document.body.classList.remove("editor-authorized","home-editing","layout-editing");
            homeEditorOn = false;
            layoutEditorOn = false;
        }
        return;
    }
    const pwd = prompt("Password modifica Borrachos:");
    if (pwd === null) return;
    const hash = await borrachosSha256(pwd);
    if (hash === BORRACHOS_EDITOR_HASH) {
        localStorage.setItem(BORRACHOS_EDITOR_KEY, "1");
        document.body.classList.add("editor-authorized");
        alert("Modalità modifica attivata su questo browser.");
    } else {
        alert("Password non corretta.");
    }
}

document.addEventListener("keydown", function(e) {
    if (e.ctrlKey && e.altKey && (e.key === "m" || e.key === "M")) {
        e.preventDefault();
        borrachosEditorLogin();
    }
});

function pageLayoutTargets(){

function warmSecondaryGraphics() {
    var classificaUrls = [
        'assets/borrachos/backgrounds/classifica/cantina%20spogliatotio.webp',
        'assets/borrachos/backgrounds/classifica/classifica-lavagna.webp',
        'assets/borrachos/backgrounds/classifica/classifica-menu-lavagna.webp',
        'assets/borrachos/backgrounds/classifica/classifica-3-colonne.webp',
        'assets/borrachos/navigation/classifica/classifica-tasto.webp',
        'assets/borrachos/navigation/classifica/formula1-tasto.webp',
        'assets/borrachos/navigation/classifica/battle-royale-tasto.webp'
    ];
    var run=function(){
        Promise.all(classificaUrls.map(function(src){
            return new Promise(function(resolve){
                var im=new Image();
                im.decoding='async';
                im.onload=function(){
                    if(im.decode) im.decode().catch(function(){}).then(resolve);
                    else resolve();
                };
                im.onerror=resolve;
                im.src=src;
                if(im.complete) im.onload();
            });
        })).then(function(){
            document.body.classList.add('classifica-graphics-ready');
        });
        var best=new Image();
        best.decoding='async';
        best.src='assets/borrachos/backgrounds/best11/santiago-bernabeer-best11.webp';

function updateGiocatori() {
    var criterio = document.getElementById('criterio-giocatori').value;
    if (!criterio) return;
    var label = document.getElementById('criterio-giocatori').options[document.getElementById('criterio-giocatori').selectedIndex].text;
    document.getElementById('head-gioc').textContent = label;
    var headGioc = document.getElementById('head-gioc');
    var headRow = headGioc.parentElement;
    var oldPres = document.getElementById('head-presenze-gioc');
    if (oldPres) oldPres.remove();
    var mediaKeysHeader = ['mediavototit', 'fvototit', 'mediavototot', 'fvototot'];
    if (mediaKeysHeader.indexOf(criterio) !== -1) {
        var thPres = document.createElement('th');
        thPres.id = 'head-presenze-gioc';
        thPres.textContent = 'Presenze';
        headRow.appendChild(thPres);
    }
    var ricerca = document.getElementById('ricerca-giocatori').value.toLowerCase().trim();
    var elencoAttivo = elencoGiocatoriAttivo();

    // Media Voto e Fantamedia: ordinamento corretto per affidabilità (Bayes).
    // Il valore corretto NON viene mostrato: serve solo per la posizione in classifica.
    var criteriMedia = ['mediavototit', 'fvototit', 'mediavototot', 'fvototot'];
    var isMedia = criteriMedia.indexOf(criterio) !== -1;
    var presKeyMedia = criterio === 'mediavototit' ? 'prestit' :
                       criterio === 'fvototit' ? 'presfvtit' :
                       criterio === 'mediavototot' ? 'prestot' : 'presfvtot';
    var K_AFFIDABILITA = 5;

    var mediaGenerale = 0;
    if (isMedia) {
        var sommaPesata = 0, presenzeTotali = 0;
        elencoAttivo.forEach(function(g) {
            var p = Number(g[presKeyMedia] || 0);
            var m = Number(g[criterio] || 0);
            if (p > 0 && m > 0) {
                sommaPesata += m * p;
                presenzeTotali += p;
            }
        });
        mediaGenerale = presenzeTotali > 0 ? sommaPesata / presenzeTotali : 0;
    }

    function valoreOrdinamento(g) {
        var valore = Number(g[criterio] || 0);
        if (!isMedia) return valore;
        var p = Number(g[presKeyMedia] || 0);
        if (p <= 0) return 0;
        return (p / (p + K_AFFIDABILITA)) * valore +
               (K_AFFIDABILITA / (p + K_AFFIDABILITA)) * mediaGenerale;
    }

    var sorted = elencoAttivo.slice().sort(function(a, b) {
        var diff = valoreOrdinamento(b) - valoreOrdinamento(a);
        if (Math.abs(diff) > 0.0000001) return diff;
        return Number(b[presKeyMedia] || 0) - Number(a[presKeyMedia] || 0);
    });

    var isPortiere = criterio.indexOf('golsubiti') === 0 || criterio.indexOf('cleansheet') === 0 || criterio.indexOf('rigpar') === 0;
    var noPortiere = criterio.indexOf('gol') === 0 && criterio.indexOf('golsubiti') !== 0 ||
                     criterio.indexOf('assist') === 0 || criterio.indexOf('rig') === 0 && criterio.indexOf('rigpar') !== 0 ||
                     criterio.indexOf('autgol') === 0 || criterio === 'autgoltit' ||
                     criterio.indexOf('pres') === 0;

    // Non mostrare in classifica giocatori senza almeno una partita/voto valido.
    // Titolari -> presenze da titolare; Totali/Serie A/Svincolati -> presenze totali.
    var presKeyClassifica = criterio.endsWith('tot') ? 'prestot' : 'prestit';
    sorted = sorted.filter(function(g) {
        return Number(g[presKeyClassifica] || 0) > 0;
    });

    var filtered;
    if (ricerca) {
        filtered = sorted.filter(function(g) { return g.nome.toLowerCase().indexOf(ricerca) !== -1; });
    } else if (isPortiere) {
        if (criterio.indexOf('golsubiti') === 0) {
            var presKey = criterio.endsWith('tot') ? 'prestot' : 'prestit';
            filtered = sorted.filter(function(g) { return g.ruolo === 'p' && (g[presKey]||0) > 0; });
        } else {
            filtered = sorted.filter(function(g) { return g.ruolo === 'p' && (g[criterio]||0) > 0; });
        }
    } else if (noPortiere) {
        filtered = sorted.filter(function(g) { return g.ruolo !== 'p' && (g[criterio]||0) > 0; });
    } else {
        filtered = sorted.filter(function(g) { return (g[criterio]||0) > 0; });
    }

    var posizioni = [];
    for (var k = 0; k < sorted.length; k++) {
        if (k === 0) posizioni.push(1);
        else {
            var curr = valoreOrdinamento(sorted[k]);
            var prev = valoreOrdinamento(sorted[k-1]);
            if (Math.abs(curr - prev) < 0.0000001) posizioni.push(posizioni[k-1]);
            else posizioni.push(k + 1);
        }
    }

    var tbody = document.querySelector('#tabella-giocatori tbody');
    var righeHtml = [];
    filtered.forEach(function(g) {
        var pos = posizioni[sorted.indexOf(g)];
        var valoreMostrato = (g[criterio] || 0);
        var presenzeMostrate = isMedia ? Number(g[presKeyMedia] || 0) : '';
        var gruppoAttivo = document.getElementById('gruppo-giocatori').value;
        var logoCell = '<td class="logo-cell"></td>';

        if (gruppoAttivo === 'borracho') {
            logoCell = '<td class="logo-cell"><img src="' + logoUrl(g.squadra) + '" onerror="this.style.display=\'none\'"></td>';
        } else if (gruppoAttivo === 'seriea') {
            // Nei "Tutti Serie A" evidenzia chi appartiene a una rosa Borracho
            // mostrando il logo della relativa fantasquadra.
            var nomeNorm = String(g.nome || '').trim().toLowerCase()
                .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                .replace(/[^a-z0-9]/g, '');
            var squadraBorracho = mappaBorrachoPerNome[nomeNorm];
            var borracho = !!squadraBorracho;
            if (borracho) {
                logoCell = '<td class="logo-cell"><img src="' + logoUrl(squadraBorracho) + '" title="' + squadraBorracho + '" onerror="this.style.display=\'none\'"></td>';
            }
        }
        var classeRiga = '';
        if (gruppoAttivo === 'seriea' && !borracho) classeRiga = ' class="riga-svincolato"';
        if (gruppoAttivo === 'svincolati') classeRiga = ' class="riga-svincolato"';
        righeHtml.push('<tr' + classeRiga + '><td class="pos">' + pos + '</td>' + logoCell + '<td>' + g.nome + '</td><td>' + g.squadra + '</td><td>' + valoreMostrato + '</td>' + (isMedia ? '<td>' + presenzeMostrate + '</td>' : '') + '</tr>');
    });
    tbody.innerHTML = righeHtml.join('');
}

function normalizzaNomeSquadra(nome) {
    var n = String(nome || '')
        .trim()
        .toLowerCase()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .replace(/[^a-z0-9]/g, '');

    var alias = {
        'tricchetracht': 'tricchetrachtfrancoforte',
        'tricchetrachtfrankfurt': 'tricchetrachtfrancoforte',
        'tricchetrachtfrancoforte': 'tricchetrachtfrancoforte',

        'pesciculinifc': 'pesciculini',
        'atlimprovvisato': 'atlimprovvisato',
        'atleticoimprovvisato': 'atlimprovvisato'
    };
    return alias[n] || n;
}

function nomeSquadraPerLogoStatistiche(nome) {
    var chiave = normalizzaNomeSquadra(nome);
    var trovata = datiSquadre.find(function(s) {
        return normalizzaNomeSquadra(s.nome) === chiave;
    });
    return trovata ? trovata.nome : nome;
}

function valoreStatSquadra(sq, criterio) {
    if (criterio === 'gol subiti') {
        var chiave = normalizzaNomeSquadra(sq.nome);
        var classifica = datiSquadre.find(function(s) {
            return normalizzaNomeSquadra(s.nome) === chiave;
        });
        return classifica ? Number(classifica.gs || 0) : 0;
    }
    return Number((sq.dati && sq.dati[criterio]) || 0);
}

function updateSquadre() {
    var criterio = document.getElementById('criterio-squadre2').value;
    var def = definizioni[criterio] || { titolo: criterio, desc: "" };
    document.getElementById('titolo-sq').textContent = def.titolo;
    var titoloStatsSquadre = document.getElementById('titolo-statistiche-squadre');
    if (titoloStatsSquadre) titoloStatsSquadre.textContent = def.titolo;
    document.getElementById('desc-sq').textContent = def.desc;
    document.querySelectorAll('.head-sq-stat').forEach(function(el) { el.textContent = def.titolo; });

    var ascending = (criterio === 'pt min');
    var sorted = datiStatSquadre.slice().sort(function(a, b) {
        var va = valoreStatSquadra(a, criterio), vb = valoreStatSquadra(b, criterio);
        return ascending ? va - vb : vb - va;
    });

    var tbody1 = document.querySelector('#tabella-sq tbody');
    var tbody2 = document.querySelector('#tabella-sq-2 tbody');
    tbody1.innerHTML = '';
    tbody2.innerHTML = '';

        if (i < 5) tbody1.innerHTML += riga;
        else tbody2.innerHTML += riga;
    });
}

function updateBest11() {
    var nums = bestModulo.split('').map(Number);
    var nDif = nums[0], nCen = nums[1], nAtt = nums[2];
    var container = document.getElementById('pitch-best11');
    container.querySelectorAll('.pitch-player').forEach(function(el) { el.remove(); });

    // Rosa Borracho: scelta fra voti da titolare e voti totali Serie A.
    // Tutti Serie A: solo voti totali Voto Statistico FC e comprende anche gli svincolati.
    var isSerieA = bestGruppo === 'seriea';
    var usaTotali = isSerieA || bestTipo === 'totali';
    var elencoBest = isSerieA ? datiGiocatoriSerieA : datiGiocatori;
    var bestMetric = bestMetricTipo === 'fanta'
        ? (usaTotali ? 'fvototot' : 'fvototit')
        : (usaTotali ? 'mediavototot' : 'mediavototit');
    var presKeyBest = bestMetricTipo === 'fanta'
        ? (usaTotali ? 'presfvtot' : 'presfvtit')
        : (usaTotali ? 'prestot' : 'prestit');

    var K_BEST11 = 5;
    var sommaPesataBest = 0, presenzeTotaliBest = 0;
    elencoBest.forEach(function(g) {
        var p = Number(g[presKeyBest] || 0);
        var m = Number(g[bestMetric] || 0);
        if (p > 0 && m > 0) {
            sommaPesataBest += m * p;
            presenzeTotaliBest += p;
        }
    });
    var mediaGeneraleBest = presenzeTotaliBest > 0 ? sommaPesataBest / presenzeTotaliBest : 0;

    function valoreBestBayes(g) {
        var p = Number(g[presKeyBest] || 0);
        var m = Number(g[bestMetric] || 0);
        if (p <= 0 || m <= 0) return -Infinity;
        return (p / (p + K_BEST11)) * m + (K_BEST11 / (p + K_BEST11)) * mediaGeneraleBest;
    }
    function ordinaBest(a, b) {
        var diff = valoreBestBayes(b) - valoreBestBayes(a);
        if (Math.abs(diff) > 0.0000001) return diff;
        return Number(b[presKeyBest] || 0) - Number(a[presKeyBest] || 0);
    }
    var giornateGiocate = giornateGiocateBest11();
    // Per i voti da TITOLARE la percentuale va calcolata sulle presenze
    // effettivamente disponibili nel campione titolari, non sulle giornate di lega:
    // altrimenti, nelle prime giornate, soglie alte possono svuotare completamente la Best 11.
    var basePresenzeBest = giornateGiocate;
    if (!usaTotali) {
        var maxPresenzeTitolari = 0;
        elencoBest.forEach(function(g) {
            var pTit = Number(g[presKeyBest] || 0);
            if (pTit > maxPresenzeTitolari) maxPresenzeTitolari = pTit;
        });
        if (maxPresenzeTitolari > 0) basePresenzeBest = maxPresenzeTitolari;
    }
    var presenzeMinime = bestPresenzePct <= 0 ? 1 : Math.ceil(basePresenzeBest * bestPresenzePct / 100);
    var infoPres = document.getElementById('best-presenze-info');
    if (infoPres) infoPres.textContent = basePresenzeBest + ' presenze disponibili · min ' + presenzeMinime + ' presenze';

    function perRuolo(ruolo) {
        return elencoBest.filter(function(g) {
            return String(g.ruolo || '').toLowerCase().slice(0,1) === ruolo
                && Number(g[presKeyBest] || 0) >= presenzeMinime
                && Number(g[bestMetric] || 0) > 0;
        }).sort(ordinaBest);
    }

    var players = [];
    var portieri = perRuolo('p');
    if (portieri.length > 0) players.push(portieri[0]);
    players = players.concat(perRuolo('d').slice(0, nDif));
    players = players.concat(perRuolo('c').slice(0, nCen));
    players = players.concat(perRuolo('a').slice(0, nAtt));

    var titolariSet = new Set(players);
    var bench = []
        .concat(perRuolo('p').filter(function(g) { return !titolariSet.has(g); }).slice(0, 1))
        .concat(perRuolo('d').filter(function(g) { return !titolariSet.has(g); }).slice(0, 3))
        .concat(perRuolo('c').filter(function(g) { return !titolariSet.has(g); }).slice(0, 3))
        .concat(perRuolo('a').filter(function(g) { return !titolariSet.has(g); }).slice(0, 3));

    var hoverCardBest11 = document.getElementById('best11-hover-card');
    function squadraBorrachoBest11(g) {
        if (!isSerieA) return g.squadra || '';
        var nomeNorm = String(g.nome || '').trim().toLowerCase()
            .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
            .replace(/[^a-z0-9]/g, '');
        return mappaBorrachoPerNome[nomeNorm] || '';
    }
    var best11Contenitori = ['fiaschetto.webp','boccale.webp','bottiglia-vino.webp','otre.webp','botte.webp','secchiello.webp','brocca.webp'];
    function contenitoreBest11(g, svincolato) {
        if (svincolato) return 'templates/aperol.webp';
        var key = String((g && g.nome) || '') + '|' + String((g && g.squadra) || '');
        var hash = 0;
        for (var i = 0; i < key.length; i++) hash = ((hash << 5) - hash + key.charCodeAt(i)) | 0;
        return 'templates/' + best11Contenitori[Math.abs(hash) % best11Contenitori.length];
    }

    function mostraSchedaBest11(g, ruoloLabel, squadraLogo) {
        if (!hoverCardBest11 || layoutEditorOn) return;
        var teamName = squadraLogo || (isSerieA ? 'SVINCOLATO' : (g.squadra || ''));

        var fantaMedia = usaTotali ? Number(g.fvototot || 0) : Number(g.fvototit || 0);
        var presenze = Number(g[presKeyBest] || 0);
        var qi = (g.qi !== undefined && g.qi !== null && g.qi !== '') ? Number(g.qi) : null;
        var qa = (g.qa !== undefined && g.qa !== null && g.qa !== '') ? Number(g.qa) : null;
        var diffQ = (qi !== null && qa !== null) ? qa - qi : null;
        var diffClass = diffQ > 0 ? 'up' : diffQ < 0 ? 'down' : 'flat';
        var diffText = diffQ === null ? '—' : (diffQ > 0 ? '+' : '') + diffQ;
        var logo3dFile = best11Logo3dUrl(squadraLogo);

        var logoSrc = logo3dFile || (squadraLogo ? logoUrl(squadraLogo) : '3d/svincolati-serie-aperol.webp');
        var contenitoreSrc = contenitoreBest11(g, svincolato);
        hoverCardBest11.className = 'best11-drink-hover is-visible';
        hoverCardBest11.innerHTML =
            '<div class="best11-drink-visual">' +
                '<img class="best11-drink-image" src="' + contenitoreSrc + '" alt="" onerror="this.style.visibility=\'hidden\'">' +
                '<img class="best11-drink-logo" src="' + logoSrc + '" alt="" onerror="this.style.visibility=\'hidden\'">' +
            '</div>' +
            '<div class="best11-drink-name">' + g.nome + '</div>' +
            '<div class="best11-drink-meta">' + teamName + ' · ' + ruoloLabel + '</div>' +
            '<div class="best11-drink-data">' +

                '<div><span>MFV</span><b>' + fantaMedia.toFixed(2) + '</b></div>' +

                '<div><span>QA</span><b>' + (qa === null ? '—' : qa) + '</b></div>' +
                '<div class="diff-' + diffClass + '"><span>+/-</span><b>' + diffText + '</b></div>' +
            '</div>';
        hoverCardBest11.setAttribute('aria-hidden','false');
    }
    function nascondiSchedaBest11() {
        if (!hoverCardBest11) return;
        hoverCardBest11.classList.remove('is-visible');
        hoverCardBest11.setAttribute('aria-hidden','true');
    }

    var benchList = document.getElementById('best11-bench-list');
    if (benchList) {
        benchList.innerHTML = '';
        bench.forEach(function(g) {
            var rlBench = g.ruolo === 'p' ? 'POR' : g.ruolo === 'd' ? 'DIF' : g.ruolo === 'c' ? 'CEN' : 'ATT';
            var squadraLogoBench = g.squadra;
            if (isSerieA) {
                var nomeNormBench = String(g.nome || '').trim().toLowerCase()
                    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                    .replace(/[^a-z0-9]/g, '');
                squadraLogoBench = mappaBorrachoPerNome[nomeNormBench] || '';
            }
            var logoBench3d = best11Logo3dUrl(squadraLogoBench);
            var logoBench = squadraLogoBench
                ? '<img class="bench-logo" src="' + (logoBench3d || logoUrl(squadraLogoBench)) + '" onerror="this.remove()">'
                : '<img class="bench-logo" src="3d/svincolati-serie-aperol.webp" onerror="this.remove()">';
            var benchEl = document.createElement('div');
            benchEl.className = 'bench-player';
            benchEl.innerHTML = logoBench
                + '<span class="bench-name" title="' + g.nome + '">' + g.nome + '</span>'
                + '<span class="bench-role">' + rlBench + '</span>'
                + '<span class="bench-vote">' + (g[bestMetric] || 0) + '</span>';
            benchEl.addEventListener('mouseenter', function() { mostraSchedaBest11(g, rlBench, squadraLogoBench); });
            benchEl.addEventListener('mouseleave', nascondiSchedaBest11);
            benchList.appendChild(benchEl);
        });
    }

    // Layout Best 11 approvati manualmente a 1536x735.
    // Solo le 11 card cambiano col modulo; campo, panchina e comandi restano indipendenti.
    var best11Layouts = {
        '352': [
            [758,128],[542,192],[754,220],[967,179],
            [406,403],[536,326],[762,307],[963,322],[1094,412],
            [635,477],[845,540]
        ],
        '442': [
            [758,144],[472,213],[664,225],[851,226],[1044,213],
            [431,403],[643,333],[847,333],[1068,395],
            [631,472],[839,472]
        ],
        '433': [
            [761,140],[461,240],[649,215],[834,216],[1028,245],
            [503,351],[746,322],[949,359],
            [402,467],[744,501],[1089,466]
        ],
        '343': [
            [754,141],[540,221],[754,222],[965,223],
            [412,328],[627,325],[847,329],[1059,331],
            [494,452],[746,496],[1001,441]
        ]
    };
    var approvedLayout = best11Layouts[bestModulo] || best11Layouts['352'];
    var viewportW = 1536, viewportH = 735;

    players.forEach(function(g, playerIndex) {
        var pos = approvedLayout[playerIndex] || [viewportW/2, viewportH/2];

        var rl = g.ruolo === 'p' ? 'POR' : g.ruolo === 'd' ? 'DIF' : g.ruolo === 'c' ? 'CEN' : 'ATT';
        var logo = '';
        if (isSerieA) {
            var nomeNormBest = String(g.nome || '').trim().toLowerCase()
                .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                .replace(/[^a-z0-9]/g, '');
            var squadraBorrachoBest = mappaBorrachoPerNome[nomeNormBest];
            if (squadraBorrachoBest) {

// === CARICA DATI ===
// Prima prova dati.json accanto all'index (sito GitHub / server locale).
// Se la pagina viene aperta direttamente come file:// e il browser blocca il fetch,
// usa automaticamente la copia pubblicata nel repository GitHub.
function caricaDatiBorrachos() {
    var locale = "dati.json";
    var github = "https://raw.githubusercontent.com/borrachosleague/Borracho-s-league-26-27/main/dati.json";

    return fetch(locale, { cache: "no-cache" })
        .then(function(r) {
            if (!r.ok) throw new Error("HTTP " + r.status);
            return r.json();
        })
        .catch(function(errLocale) {
            console.warn("dati.json locale non raggiungibile; provo GitHub:", errLocale);
            return fetch(github, { cache: "no-cache" }).then(function(r) {
                if (!r.ok) throw new Error("GitHub HTTP " + r.status);
                return r.json();
            });
        });
}

caricaDatiBorrachos()
    .then(function(d) {
        uniformaNomiSquadre(d);
        datiSquadre = d.squadre;
        datiGiocatori = d.giocatori || [];
        datiGiocatoriSerieA = d.giocatori_seriea || [];
        datiGiocatoriSvincolati = d.giocatori_svincolati || [];

        // Cache per riconoscere istantaneamente i giocatori già nelle rose Borracho.
        mappaBorrachoPerNome = Object.create(null);
        datiGiocatori.forEach(function(bg) {
            var bn = String(bg.nome || '').trim().toLowerCase()
                .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                .replace(/[^a-z0-9]/g, '');
            if (bn) mappaBorrachoPerNome[bn] = bg.squadra;
        });

        datiRisultati = d.risultati || [];
        datiStatSquadre = d.stat_squadre || d.statSquadre || d.statistiche_squadre || [];
        var selSq = document.getElementById('criterio-squadre2');
        popolaCriteriSquadre();
        resizeSelect(document.getElementById('categoria-squadre'));

        var selR = document.getElementById('sel-risultati');
        var giornateWrap = document.getElementById('risultati-giornate');
        if (selR) selR.value = '0';
        if (giornateWrap) {
            giornateWrap.innerHTML = '';
            for (var gi = 0; gi < 36; gi++) {
                var giornataDati = datiRisultati[gi];
                var giocata = !!(giornataDati && giornataDati.partite && giornataDati.partite.some(function(p) {
                    return Number(p.pt_casa || 0) !== 0 || Number(p.pt_trasferta || 0) !== 0 ||
                           Number(p.gol_casa || 0) !== 0 || Number(p.gol_trasferta || 0) !== 0;
                }));
                var classiGiornata = 'giornata-btn' + (gi === 0 ? ' active' : '') + (giocata ? '' : ' future');
                giornateWrap.innerHTML += '<button class="' + classiGiornata + '" onclick="setGiornataRisultati(' + gi + ', this)">' + (gi + 1) + '</button>';
            }
        }

        // Prima renderizziamo la Classifica; il resto viene distribuito
        // nei frame successivi per non bloccare il primo caricamento della pagina.
        updateClassifica();
        warmSecondaryGraphics();
        requestAnimationFrame(function() {
            cambiaGruppoGiocatori();
            resizeSelect(document.getElementById('gruppo-giocatori'));
            resizeSelect(document.getElementById('criterio-giocatori'));
            requestAnimationFrame(function() {
                updateSquadre();
                if (datiRisultati.length > 0) updateRisultati();
                requestAnimationFrame(updateBest11);
            });
        });
    })
    .catch(function(e) {
        document.body.innerHTML = '<div style="text-align:center;padding:40px;color:#e94560;">Errore caricamento dati: ' + e.message + '<br><br>Non è stato possibile leggere né dati.json locale né la copia pubblicata su GitHub.</div>';
    });
</script>




























<style id="borrachos-team-name-dot-fallback">
#page-classifica .chalk-team .ultra-dot-fallback,
#page-classifica .mobile-short-name .ultra-dot-fallback{
  font-family:Arial,Helvetica,sans-serif!important;
  font-weight:900!important;
}
</style>
<script id="borrachos-team-name-dot-fallback-js">
(function(){
  function fixTeamDots(){
    document.querySelectorAll('#page-classifica .chalk-team').forEach(el=>{
      const walker=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);
      const nodes=[];
      while(walker.nextNode()) nodes.push(walker.currentNode);

      nodes.forEach(node=>{
        if(node.parentElement && node.parentElement.classList.contains('ultra-dot-fallback')) return;
        if(!node.nodeValue || !node.nodeValue.includes('.')) return;

        const parts=node.nodeValue.split('.');
        const frag=document.createDocumentFragment();
        parts.forEach((part,i)=>{
          if(part) frag.appendChild(document.createTextNode(part));
          if(i<parts.length-1){
            const span=document.createElement('span');
            span.className='ultra-dot-fallback';
            span.textContent='.';
            frag.appendChild(span);
          }
        });
        node.replaceWith(frag);
      });
    });
  }

  function start(){
    fixTeamDots();
    setTimeout(fixTeamDots,900);
  }

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',start,{once:true});
  }else{
    start();
  }
})();
</script>
