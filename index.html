        .subpage.active { display: block; }

/* === PITCH BEST 11 === */
.pitch-container {
    position: relative;
    width: 100%;
    max-width: 700px;
    margin: 0;
    aspect-ratio: 4/3;
    background: linear-gradient(90deg, #2d5a27 0%, #3a7a33 50%, #2d5a27 100%);
    border: 3px solid #fff;
    border-radius: 8px;
    overflow: hidden;
    flex: 1;
}
.pitch-lines {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
}
.pitch-lines::before {
    content: '';
    position: absolute;
    top: 0; left: 50%;
    width: 2px; height: 100%;
    background: rgba(255,255,255,0.5);
}
.pitch-center-circle {
    position: absolute;
    top: 50%; left: 50%;
    height: 18%; aspect-ratio: 1;
    transform: translate(-50%, -50%);
    border: 2px solid rgba(255,255,255,0.5);
    border-radius: 50%;
}
.pitch-center-spot {
    position: absolute;
    top: 50%; left: 50%;
    width: 6px; height: 6px;
    transform: translate(-50%, -50%);
    background: rgba(255,255,255,0.7);
    border-radius: 50%;
}
.pitch-box-left, .pitch-box-right {
    position: absolute;
    top: 50%; transform: translateY(-50%);
    height: 60%; width: 14%;
    border: 2px solid rgba(255,255,255,0.5);
}
.pitch-box-left { left: 0; border-left: none; }
.pitch-box-right { right: 0; border-right: none; }
.pitch-goal-box-left, .pitch-goal-box-right {
    position: absolute;
    top: 50%; transform: translateY(-50%);
    height: 30%; width: 6%;
    border: 2px solid rgba(255,255,255,0.5);
}
.pitch-goal-box-left { left: 0; border-left: none; }
.pitch-goal-box-right { right: 0; border-right: none; }
.pitch-penalty-left, .pitch-penalty-right {
    position: absolute;
    top: 50%;
    width: 6px; height: 6px;
    background: rgba(255,255,255,0.7);
    border-radius: 50%;
}
.pitch-penalty-left { left: 10%; transform: translateY(-50%); }
.pitch-penalty-right { right: 10%; transform: translateY(-50%); }

.pitch-player {
    position: absolute;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    z-index: 2;
    transition: all 0.4s ease;
}
.pitch-player .pp-logo {
    width: 50px; height: 50px;
    border-radius: 50%;
    border: 2px solid #fff;
    box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    background: #1a1a2e;
}
.pitch-player .pp-name {
    font-size: 1em;
    font-weight: 700;
    color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    background: rgba(0,0,0,0.6);
    padding: 2px 6px;
    border-radius: 3px;
    white-space: nowrap;
    max-width: 100px;
    overflow: hidden;
    text-overflow: ellipsis;
}
.pitch-player .pp-val {
    font-size: 0.9em;
    font-weight: 800;
    color: #ffd700;
    text-shadow: 0 1px 2px rgba(0,0,0,0.8);
}
.pitch-player .pp-ruolo {
    font-size: 0.7em;
    color: #aaa;
    text-shadow: 0 1px 2px rgba(0,0,0,0.8);
}

@media (max-width: 768px) {
    .best11-layout { flex-direction: column; }

    .pitch-container { max-width: 100%; }
}

            .giocatori-layout { flex-direction: column; }

            .page-title { font-size: 1.1em; }
        }

            .pitch-player .pp-name { font-size: 0.8em; max-width: 70px; }
            .pitch-player .pp-val { font-size: 0.75em; }
        }

    "diff tot pt": { titolo: "Diff. Fantapunti", desc: "Differenza fantapunti e fantapunti best" },
    "pt max": { titolo: "Punteggio Max", desc: "Punteggio più alto della stagione" },
    "pt min": { titolo: "Punteggio Min", desc: "Punteggio più basso della stagione" },
    "gol d": { titolo: "Gol Difensori", desc: "Gol segnati dai difensori titolari" },
    "gol c": { titolo: "Gol Centrocampisti", desc: "Gol segnati dai centrocampisti titolari" },
    "gol a": { titolo: "Gol Attaccanti", desc: "Gol segnati dagli attaccanti titolari" }
};

const noPortieri = ['goltit', 'assisttit', 'rigtit', 'risgsbtit', 'autgoltit', 'prestit'];
const soloPortieri = ['golsubititit', 'cleansheettit', 'rigpartit'];

function resizeSelect(sel) {
    var opt = sel.options[sel.selectedIndex];
    var len = opt ? opt.text.length : 0;
    sel.style.width = Math.max(120, len * 9 + 55) + 'px';
}

function showPage(page, btn) {
    document.querySelectorAll('.page').forEach(function(p) {
        p.classList.remove('active');
        p.style.display = 'none';
    });
    document.querySelectorAll('.nav-btn').forEach(function(b) { b.classList.remove('active'); });
    var target = document.getElementById('page-' + page);
    target.classList.add('active');
    target.style.display = 'block';
    if (btn) btn.classList.add('active');
    document.body.classList.toggle('home-active', page === 'home');
}

function populateHomeLoghi() {
    var container = document.getElementById('home-loghi');
    container.innerHTML = '';
    var n = datiSquadre.length;
    var perColonna = 5;
    for (var i = 0; i < n; i++) {
        var img = document.createElement('img');
        img.src = logoUrl(datiSquadre[i].nome);
        img.onerror = function() { this.style.display = 'none'; };
        var col = Math.floor(i / perColonna);
        var row = i % perColonna;
        var y = 5 + row * 17;
        if (col === 0) {
            img.className = 'home-logo-left';
            img.style.left = '2%';
        } else {
            img.className = 'home-logo-right';
            img.style.right = '-25%';
            img.style.left = 'auto';
        }
        img.style.top = y + '%';
        container.appendChild(img);
    }
}

function showSubPage(sub, btn) {
    document.querySelectorAll('.subpage').forEach(function(p) { p.classList.remove('active'); });
    document.querySelectorAll('.subnav-btn').forEach(function(b) { b.classList.remove('active'); });
    document.getElementById('sub-' + sub).classList.add('active');
    btn.classList.add('active');
}

function getVal(obj, criterio) {
    if (criterio === 'dr') return obj.gf - obj.gs;
    return obj[criterio] || 0;
}

function logoUrl(nome) {
    return "loghi finiti/" + nome.toLowerCase().replace(/ /g, "-") + ".png";
}

function updateClassifica() {
    var sorted = datiSquadre.slice().sort(function(a, b) {
        if (b.pt !== a.pt) return b.pt - a.pt;
        return b.pt_totali - a.pt_totali;
    });
    var tbody = document.querySelector('#tabella-classifica tbody');
    tbody.innerHTML = '';
    sorted.forEach(function(sq, i) {
        tbody.innerHTML += '<tr><td class="pos">' + (i+1) + '</td><td class="logo-cell"><img src="' + logoUrl(sq.nome) + '" onerror="this.style.display=\'none\'"></td><td>' + sq.nome + '</td><td>' + sq.pt + '</td><td>' + sq.v + '</td><td>' + sq.n + '</td><td>' + sq.p + '</td><td>' + sq.gf + '</td><td>' + sq.gs + '</td><td>' + sq.dr + '</td><td>' + sq.pt_totali + '</td></tr>';
    });
}

function updateGiocatori() {
    var criterio = document.getElementById('criterio-giocatori').value;
    var label = document.getElementById('criterio-giocatori').options[document.getElementById('criterio-giocatori').selectedIndex].text;
    document.getElementById('head-gioc').textContent = label;
    var ricerca = document.getElementById('ricerca-giocatori').value.toLowerCase().trim();

    var sorted = datiGiocatori.slice().sort(function(a, b) { return (b[criterio]||0) - (a[criterio]||0); });

    var filtered;
    if (ricerca) {
        filtered = sorted.filter(function(g) { return g.nome.toLowerCase().indexOf(ricerca) !== -1; });
    } else if (soloPortieri.indexOf(criterio) !== -1) {
        if (criterio === 'golsubititit') {
            filtered = sorted.filter(function(g) { return g.ruolo === 'p' && g.prestit > 0; });
        } else {
            filtered = sorted.filter(function(g) { return g.ruolo === 'p' && (g[criterio]||0) > 0; });
        }
    } else if (noPortieri.indexOf(criterio) !== -1) {
        filtered = sorted.filter(function(g) { return g.ruolo !== 'p' && (g[criterio]||0) > 0; });
    } else {
        filtered = sorted.filter(function(g) { return (g[criterio]||0) > 0; });
    }

    var posizioni = [];
    for (var k = 0; k < sorted.length; k++) {
        if (k === 0) {
            posizioni.push(1);
        } else if ((sorted[k][criterio]||0) === (sorted[k-1][criterio]||0)) {
            posizioni.push(posizioni[k-1]);
        } else {
            posizioni.push(k + 1);
        }
    }

    var tbody = document.querySelector('#tabella-giocatori tbody');
    tbody.innerHTML = '';
    filtered.forEach(function(g) {
        var pos = posizioni[sorted.indexOf(g)];
        tbody.innerHTML += '<tr><td class="pos">' + pos + '</td><td class="logo-cell"><img src="' + logoUrl(g.squadra) + '" onerror="this.style.display=\'none\'"></td><td>' + g.nome + '</td><td>' + g.squadra + '</td><td>' + (g[criterio]||0) + '</td></tr>';
    });
}

function updateSquadre() {
    var criterio = document.getElementById('criterio-squadre2').value;
    var def = definizioni[criterio] || { titolo: criterio, desc: "" };
    document.getElementById('titolo-sq').textContent = def.titolo;
    document.getElementById('desc-sq').textContent = def.desc;
    document.getElementById('head-sq').textContent = def.titolo;

    var ascending = (criterio === 'pt min');
    var sorted = datiStatSquadre.slice().sort(function(a, b) {
        var va = a.dati[criterio]||0, vb = b.dati[criterio]||0;
        return ascending ? va - vb : vb - va;
    });

    var tbody = document.querySelector('#tabella-sq tbody');
    tbody.innerHTML = '';
    sorted.forEach(function(sq, i) {
        tbody.innerHTML += '<tr><td class="pos">' + (i+1) + '</td><td class="logo-cell"><img src="' + logoUrl(sq.nome) + '" onerror="this.style.display=\'none\'"></td><td>' + sq.nome + '</td><td>' + (sq.dati[criterio]||0) + '</td></tr>';
    });
}

function updateRisultati() {
    var idx = document.getElementById('sel-risultati').selectedIndex;
    if (idx < 0 || idx >= datiRisultati.length) return;
    var g = datiRisultati[idx];
    var tbody = document.querySelector('#tabella-risultati tbody');
    tbody.innerHTML = '';
    g.partite.forEach(function(p) {
        tbody.innerHTML += '<tr><td>' + p.casa + '</td><td>' + p.pt_casa + '</td><td style="text-align:center;font-weight:700;color:#e94560;">' + p.gol_casa + '</td><td style="text-align:center;font-weight:700;color:#e94560;">' + p.gol_trasferta + '</td><td>' + p.pt_trasferta + '</td><td>' + p.trasferta + '</td></tr>';
    });
}

// === BEST 11 ===
var bestMetric = 'mediavototit';
var bestModulo = '352';

function setBestMetric(metric, btn) {
    bestMetric = metric;
    btn.parentElement.querySelectorAll('.subnav-btn').forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');
    updateBest11();
}

function setBestModulo(modulo, btn) {
    bestModulo = modulo;
    btn.parentElement.querySelectorAll('.subnav-btn').forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');
    updateBest11();
}

function updateBest11() {
    var nums = bestModulo.split('').map(Number);
    var nDif = nums[0], nCen = nums[1], nAtt = nums[2];

    var container = document.getElementById('pitch-best11');
    container.querySelectorAll('.pitch-player').forEach(function(el) { el.remove(); });

    var players = [];

    var portieri = datiGiocatori.filter(function(g) { return g.ruolo === 'p'; });
    portieri.sort(function(a, b) {
        var va = a[bestMetric] || 0, vb = b[bestMetric] || 0;
        if (vb !== va) return vb - va;
        return (b.prestit || 0) - (a.prestit || 0);
    });
    if (portieri.length > 0) players.push(portieri[0]);

    var dif = datiGiocatori.filter(function(g) { return g.ruolo === 'd'; });
    dif.sort(function(a, b) {
        var va = a[bestMetric] || 0, vb = b[bestMetric] || 0;
        if (vb !== va) return vb - va;
        return (b.prestit || 0) - (a.prestit || 0);
    });
    players = players.concat(dif.slice(0, nDif));

    var cen = datiGiocatori.filter(function(g) { return g.ruolo === 'c'; });
    cen.sort(function(a, b) {
        var va = a[bestMetric] || 0, vb = b[bestMetric] || 0;
        if (vb !== va) return vb - va;
        return (b.prestit || 0) - (a.prestit || 0);
    });
    players = players.concat(cen.slice(0, nCen));

    var att = datiGiocatori.filter(function(g) { return g.ruolo === 'a'; });
    att.sort(function(a, b) {
        var va = a[bestMetric] || 0, vb = b[bestMetric] || 0;
        if (vb !== va) return vb - va;
        return (b.prestit || 0) - (a.prestit || 0);
    });
    players = players.concat(att.slice(0, nAtt));

    // Y: distribuiti verticalmente (altezza)
    function getY(n, i) {
        if (n === 1) return 50;
        var margin = 15;
        var step = (100 - 2 * margin) / (n - 1);
        return margin + i * step;
    }

    // X: portiere 8%, difensori 30%, centrocampisti 55%, attaccanti 82%
    var groups = [
        { list: players.slice(0, 1), x: 8 },
        { list: players.slice(1, 1 + nDif), x: 30 },
        { list: players.slice(1 + nDif, 1 + nDif + nCen), x: 55 },
        { list: players.slice(1 + nDif + nCen), x: 82 }
    ];

    groups.forEach(function(grp) {
        var n = grp.list.length;
        grp.list.forEach(function(g, i) {
            var y = getY(n, i);
            var el = document.createElement('div');
            el.className = 'pitch-player';
            el.style.left = grp.x + '%';
            el.style.top = y + '%';

            var rl = g.ruolo === 'p' ? 'POR' : g.ruolo === 'd' ? 'DIF' : g.ruolo === 'c' ? 'CEN' : 'ATT';
            el.innerHTML =
                '<img class="pp-logo" src="' + logoUrl(g.squadra) + '" onerror="this.style.display=\'none\'">'
                + '<span class="pp-name">' + g.nome + '</span>'
                + '<span class="pp-val">' + (g[bestMetric]||0) + '</span>'
                + '<span class="pp-ruolo">' + rl + '</span>';

            container.appendChild(el);
        });
    });
}   
// === CARICA DATI ===
fetch("dati.json")
    .then(function(r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function(d) {
        datiSquadre = d.squadre;
        datiGiocatori = d.giocatori;
        datiRisultati = d.risultati || [];
        datiStatSquadre = d.stat_squadre || [];
        var colStat = d.stat_colonne || [];
        var selSq = document.getElementById('criterio-squadre2');
        selSq.innerHTML = '';
        colStat.forEach(function(c) {
            if (c) {
                var label = (definizioni[c] && definizioni[c].titolo) ? definizioni[c].titolo : c;
                selSq.innerHTML += '<option value="' + c + '">' + label + '</option>';
            }
        });
        if (colStat.length > 0) { updateSquadre(); resizeSelect(selSq); }

        var selR = document.getElementById('sel-risultati');
        selR.innerHTML = '';
        datiRisultati.forEach(function(g, i) {
            selR.innerHTML += '<option value="' + i + '">' + g.giornata + '\u00aa Giornata</option>';
        });

        updateClassifica();
        populateHomeLoghi();
        updateGiocatori(); resizeSelect(document.getElementById('criterio-giocatori'));
        updateSquadre();
        if (datiRisultati.length > 0) updateRisultati();
        updateBest11();
    })
    .catch(function(e) {
        document.body.innerHTML = '<div style="text-align:center;padding:40px;color:#e94560;">Errore: ' + e.message + '<br><br>Verifica che dati.json sia nella stessa cartella.</div>';
    });
</script>
